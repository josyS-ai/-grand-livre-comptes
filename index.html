<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grand Livre des Comptes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --paper:#F8FAFC; --paper-dark:#EEF2F6; --card:#FFFFFF;
    --ink:#0F172A; --ink-soft:#475569; --ink-faint:#94A3B8; --line:#E2E8F0;
    --gold:#2563EB; --gold-light:#60A5FA; --gold-pale:#DBEAFE;
    --sage:#10B981; --sage-pale:#D1FAE5;
    --slate:#F59E0B; --slate-pale:#FEF3C7;
    --rust:#EF4444; --rust-pale:#FEE2E2;
    --shadow: 0 1px 2px rgba(15,23,42,0.05), 0 4px 14px rgba(15,23,42,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 500px at 10% -10%, rgba(37,99,235,0.05), transparent), var(--paper);
    color:var(--ink); font-family:'Inter', sans-serif; min-height:100vh;
  }
  .app{ min-height:100vh; }

  .app-shell{ display:flex; min-height:100vh; }
  .main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .page-content{ padding:14px 14px 92px; max-width:1500px; }

  .save-indicator{ font-size:11.5px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace;
    display:flex; align-items:center; gap:6px; white-space:nowrap;}
  .save-dot{width:6px;height:6px;border-radius:50%;background:var(--sage);}
  .save-dot.saving{background:var(--gold); animation:pulse 0.9s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}

  .top-strip{ display:none; }

  /* ---- Navigation : sidebar (tablette/desktop) ---- */
  .sidebar-nav{ display:none; }

  /* ---- Navigation : bas + FAB (mobile) ---- */
  .bottomnav{ position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; justify-content:space-around; padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
    z-index:100; box-shadow:0 -2px 10px rgba(15,23,42,0.06);}
  .bottomnav .nav-btn{ background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--ink-faint); font-size:10.5px; font-weight:600; flex:1; padding:4px 0; font-family:'Inter',sans-serif;}
  .bottomnav .nav-btn .ic{ font-size:19px; }
  .bottomnav .nav-btn.active{ color:var(--gold); }

  .fab{ position:fixed; right:18px; bottom:76px; width:54px; height:54px; border-radius:50%;
    background:var(--gold); color:#fff; border:none; font-size:26px; box-shadow:0 6px 18px rgba(37,99,235,0.4);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:101;}

  /* ---- Menu tiroir (mobile, "Plus") ---- */
  .mobile-drawer-backdrop{ position:fixed; inset:0; background:rgba(15,23,42,0.45); z-index:200; opacity:0; pointer-events:none; transition:opacity .15s;}
  .mobile-drawer-backdrop.open{ opacity:1; pointer-events:auto; }
  .mobile-drawer{ position:fixed; top:0; left:0; bottom:0; width:270px; background:var(--card); z-index:201;
    transform:translateX(-100%); transition:transform .2s ease; display:flex; flex-direction:column; box-shadow:4px 0 20px rgba(15,23,42,0.2);}
  .mobile-drawer.open{ transform:translateX(0); }
  .mobile-drawer-head{ background:var(--gold); color:#fff; padding:20px 18px; font-weight:800; font-size:16px;}
  .mobile-drawer-head .sub{ font-size:11.5px; font-weight:500; opacity:0.85; margin-top:2px;}
  .mobile-drawer-list{ padding:8px; overflow-y:auto; flex:1;}
  .mobile-drawer-item{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:8px; color:var(--ink);
    font-size:14px; font-weight:600; cursor:pointer;}
  .mobile-drawer-item:hover{ background:var(--paper-dark); }
  .mobile-drawer-item.active{ background:var(--gold-pale); color:var(--gold); }
  .mobile-drawer-item .ic{ font-size:17px; width:22px; text-align:center;}
  .mobile-drawer-divider{ height:1px; background:var(--line); margin:8px 4px; }

  @media (min-width:768px){
    .bottomnav, .fab, .mobile-drawer, .mobile-drawer-backdrop{ display:none; }
    .top-strip{ display:flex; justify-content:flex-end; align-items:center; gap:10px; padding:10px 22px 0; }
    .sidebar-nav{ display:flex; flex-direction:column; align-items:center; gap:16px; width:76px;
      background:var(--card); border-right:1px solid var(--line); padding:18px 0; position:sticky; top:0; height:100vh; flex-shrink:0;}
    .sidebar-nav .brand{ font-size:19px; margin-bottom:4px; }
    .sidebar-nav .nav-btn{ width:100%; font-size:9.5px; background:none; border:none; cursor:pointer; color:var(--ink-faint);
      display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; font-weight:600; font-family:'Inter',sans-serif;}
    .sidebar-nav .nav-btn .ic{ font-size:19px; }
    .sidebar-nav .nav-btn.active{ color:var(--gold); }
    .sidebar-actions{ display:flex; flex-direction:column; gap:16px; width:100%; margin-top:auto; padding-top:16px; border-top:1px solid var(--line); }
    .page-content{ padding:18px 22px 26px; }
  }

  @media (min-width:1024px){
    .sidebar-nav{ width:216px; align-items:stretch; padding:20px 12px; gap:3px;}
    .sidebar-nav .brand{ align-self:flex-start; padding:0 10px; margin-bottom:16px; font-size:16.5px; font-weight:800;}
    .sidebar-nav .nav-btn{ flex-direction:row; justify-content:flex-start; gap:10px; padding:9px 10px; border-radius:8px; font-size:13px;}
    .sidebar-nav .nav-btn .ic{ font-size:16px; width:20px; text-align:center;}
    .sidebar-nav .nav-btn.active{ background:var(--gold-pale); color:var(--gold); }
    .sidebar-nav .nav-btn:hover{ background:var(--paper-dark); }
    .sidebar-actions{ gap:3px; padding-top:14px; }
    .page-content{ padding:22px 30px 30px; }
  }


  h2.title{ font-family:'Inter', sans-serif; font-size:20px; font-weight:600; margin:0 0 4px;}
  p.desc{ color:var(--ink-soft); font-size:13px; margin:0 0 18px; line-height:1.5; max-width:700px;}

  .month-row{ display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
  .month-row label{ font-size:12.5px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:0.04em;}
  select, input[type=text], input[type=number], input[type=date], textarea{
    font-family:'Inter', sans-serif; font-size:14px; color:var(--ink);
    background:var(--card); border:1.5px solid var(--line); border-radius:6px;
    padding:8px 10px; outline:none; transition:border-color .15s;}
  select:focus, input:focus, textarea:focus{ border-color:var(--gold); }
  select.month-select{ font-weight:600; font-family:'IBM Plex Mono', monospace; min-width:160px;}

  .summary-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:24px;}
  .summary-card{ border:1.5px solid var(--line); border-radius:10px; padding:14px 16px; background:var(--card);}
  .summary-card .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
  .summary-card .value{ font-family:'IBM Plex Mono', monospace; font-size:19px; font-weight:600; color:var(--ink); white-space:nowrap;}
  .summary-card .value.gold{ color:var(--gold); } .summary-card .value.sage{ color:var(--sage); } .summary-card .value.rust{ color:var(--rust); }
  @media (min-width:640px){ .summary-card .value{ font-size:22px; } }

  /* Comptes */
  .account-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-top:8px;}
  .account-card{ border:1px solid var(--line); border-radius:10px; background:var(--card); padding:14px 16px; position:relative;}
  .account-card .aicon{ font-size:22px; margin-bottom:6px; }
  .account-card .aname{ font-family:'Inter', sans-serif; font-weight:600; font-size:15px; margin-bottom:4px;}
  .account-card .abal{ font-family:'IBM Plex Mono', monospace; font-size:18px; font-weight:600;}
  .account-card .abal.neg{ color:var(--rust); }
  .account-card .aflow{ display:flex; justify-content:space-between; gap:8px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-family:'IBM Plex Mono', monospace; font-size:11.5px;}
  .account-card .aflow .in{ color:var(--sage); } .account-card .aflow .out{ color:var(--rust); }
  .icon-pick{ display:flex; gap:6px; flex-wrap:wrap; }
  .icon-pick span{ font-size:18px; border:1.5px solid var(--line); border-radius:8px; padding:5px 8px; cursor:pointer; background:var(--card);}
  .icon-pick span.active{ border-color:var(--gold); background:var(--gold-pale); }

  /* Plans (grand groupes) */
  .plan-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:8px;}
  .plan-card{ border:1px solid var(--line); border-radius:10px; background:var(--card); padding:16px;
    cursor:pointer; transition:transform .12s, box-shadow .12s; position:relative; overflow:hidden;}
  .plan-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .plan-card .type-badge{ position:absolute; top:14px; right:14px; font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.04em; padding:3px 8px; border-radius:20px;}
  .type-badge.mensuel{ background:var(--gold-pale); color:var(--gold); }
  .type-badge.projet{ background:var(--sage-pale); color:var(--sage); }
  .type-badge.budget{ background:var(--slate-pale); color:var(--slate); }
  .plan-card .pname{ font-family:'Inter', sans-serif; font-weight:600; font-size:16.5px; margin:0 64px 2px 0; line-height:1.25;}
  .plan-card .pmeta{ font-size:11.5px; color:var(--ink-faint); margin-bottom:12px;}
  .plan-card .pnums{ display:flex; justify-content:space-between; font-family:'IBM Plex Mono', monospace; font-size:12.5px; margin-bottom:8px;}
  .plan-card .pnums b{ font-size:14px; }
  .plan-card .preste{ font-size:11.5px; color:var(--ink-soft); margin-bottom:6px;}
  .summary-card .delta{ font-size:11px; color:var(--ink-soft); margin-top:5px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:var(--shadow);}
  .section-title{ font-size:14px; font-weight:700; color:var(--ink); margin:14px 0 8px; display:flex; justify-content:space-between; align-items:center;}
  .link-goto{ font-size:11.5px; font-weight:600; color:var(--gold); cursor:pointer; }
  .link-goto:hover{ text-decoration:underline; }
  .two-col{ display:flex; flex-direction:column; gap:20px; margin-top:6px;}
  .col-main{ display:flex; flex-direction:column; }
  .col-side{ display:flex; flex-direction:column; gap:12px; }
  .tx-list{ display:flex; flex-direction:column; }
  .tx-row-mini{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; cursor:pointer;}
  .tx-row-mini:last-child{ border-bottom:none; }
  .tx-row-mini:hover{ background:rgba(37,99,235,0.03); }
  .tx-left{ display:flex; flex-direction:column; gap:2px; min-width:0;}
  .tx-cat{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tx-sub{ font-size:11px; color:var(--ink-faint); }
  .tx-amt-mini{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:13px; white-space:nowrap; padding-left:8px; color:var(--ink);}
  .tx-amt-mini.in{ color:var(--sage); } .tx-amt-mini.out{ color:var(--rust); }

  .kpi-row{ grid-template-columns:1fr 1fr; }
  @media (min-width:640px){ .kpi-row{ grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); } }

  @media (min-width:900px){
    .two-col{ flex-direction:row; align-items:flex-start; }
    .col-main{ flex:1.7; }
    .col-side{ flex:1; min-width:270px; }
  }

  .mini-bar-bg{ height:9px; border-radius:6px; background:var(--paper-dark); border:1px solid var(--line); overflow:hidden;}
  .mini-bar-fill{ height:100%; background:linear-gradient(90deg, var(--gold-light), var(--gold)); }
  .mini-bar-fill.complete{ background:var(--sage); } .mini-bar-fill.over{ background:var(--rust); }
  .mini-bar-fill.spend{ background:linear-gradient(90deg, #8CA0B3, var(--slate)); }
  .add-plan-card{ border:1.5px dashed var(--gold); border-radius:10px; background:transparent;
    display:flex; align-items:center; justify-content:center; min-height:110px; color:var(--gold); font-weight:600; font-size:13.5px; cursor:pointer;}
  .add-plan-card:hover{ background:var(--gold-pale); }

  /* Catégorie mini report (dashboard) */
  .cat-mini-cols{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:6px;}
  .cat-mini-col h3{ font-size:12.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); margin:0 0 10px;}
  .cat-mini-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; padding:6px 0; border-bottom:1px solid var(--line);}
  .cat-mini-row .catname{ flex:1; }
  .cat-mini-row .catval{ font-family:'IBM Plex Mono', monospace; font-weight:600; white-space:nowrap;}
  @media (max-width:640px){ .cat-mini-cols{ grid-template-columns:1fr; } }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; margin-top:4px;}
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft);
    border-bottom:1.5px solid var(--line); padding:8px 8px; font-weight:600; white-space:nowrap;}
  td{ padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:hover td{ background:rgba(166,118,59,0.035); }
  .num{ font-family:'IBM Plex Mono', monospace; text-align:right; white-space:nowrap;}
  .cell-input{ width:100px; padding:5px 7px; font-size:13px; text-align:right; font-family:'IBM Plex Mono', monospace;}
  .cell-input-wide{ width:100%; min-width:120px; padding:5px 7px; font-size:13px;}
  .desc-cell{ color:var(--ink-soft); font-size:12.5px; max-width:200px;}
  .badge{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .badge.none{ background:var(--paper-dark); color:var(--ink-soft); border:1px solid var(--line);}
  .badge.progress{ background:var(--gold-pale); color:var(--gold); border:1px solid var(--gold-light);}
  .badge.complete{ background:var(--sage-pale); color:var(--sage); border:1px solid var(--sage);}
  .badge.over{ background:var(--rust-pale); color:var(--rust); border:1px solid var(--rust);}
  .badge.entree{ background:var(--sage-pale); color:var(--sage); border:1px solid var(--sage);}
  .badge.sortie{ background:var(--rust-pale); color:var(--rust); border:1px solid var(--rust);}
  .badge.transfert{ background:var(--slate-pale); color:var(--slate); border:1px solid var(--slate);}
  .table-scroll{ overflow-x:auto; }

  .tx-filters-box{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px;
    padding:14px 16px; background:var(--paper-dark); border-radius:8px; border:1.5px solid var(--line); position:relative; overflow:visible;}
  .tx-filters-box .field{ min-width:150px; }
  .tx-filters-box .field.grow{ flex:1; min-width:180px; }
  .cat-filter-btn{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:6px;
    font-family:'Inter', sans-serif; font-size:13px; padding:8px 10px; border-radius:6px;
    border:1.5px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cat-filter-btn:hover{ border-color:var(--gold); }
  .cat-filter-panel{ position:absolute; top:100%; left:0; margin-top:4px; z-index:30; width:230px; max-width:80vw;
    background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; box-shadow:var(--shadow);
    max-height:240px; overflow-y:auto;}
  .cat-filter-panel-actions{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .cat-filter-check{ display:flex; align-items:center; gap:7px; font-size:12.5px; padding:5px 2px; cursor:pointer; border-radius:4px;}
  .cat-filter-check:hover{ background:var(--paper-dark); }
  .cat-filter-check input{ accent-color:var(--gold); }
  .tx-summary-strip{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .tx-summary-chip{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card);}
  .tx-summary-chip b{ font-size:14px; }
  .tx-summary-chip.in b{ color:var(--sage); } .tx-summary-chip.out b{ color:var(--rust); }
  .tx-row-actions{ display:flex; gap:6px; }
  .btn.small{ padding:5px 9px; font-size:11.5px; }

  .chart-section{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:36px; margin:16px 0 26px;}
  .chart-block{ text-align:center; }
  .chart-block h3{ font-size:12px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); margin:0 0 10px; font-weight:600;}
  .donut-canvas{ max-width:190px; width:100%; height:auto; }
  .chart-legend{ text-align:left; margin-top:12px; max-height:190px; overflow-y:auto; padding-right:4px;}

  .modal-overlay{ position:fixed; inset:0; background:rgba(43,36,23,0.55); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
  .modal-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; max-width:460px; width:100%; max-height:85vh; overflow-y:auto; box-shadow:0 20px 50px rgba(15,23,42,0.18);}
  .modal-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; gap:10px;}
  .modal-head h2{ margin:0; font-size:18px; font-family:'Inter', sans-serif; font-weight:600;}
  .modal-close-btn{ background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; line-height:1; padding:2px 6px; flex-shrink:0;}
  .modal-close-btn:hover{ color:var(--ink); }
  .detail-row{ display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .detail-row:last-child{ border-bottom:none; }
  .detail-label{ color:var(--ink-soft); font-weight:600; white-space:nowrap;}
  .detail-value{ text-align:right; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap;}
  .clickable-row{ cursor:pointer; }
  .chevron-cell{ color:var(--ink-faint); text-align:center; font-size:15px; width:18px;}
  .account-card.clickable{ cursor:pointer; transition:transform .12s, box-shadow .12s;}
  .account-card.clickable:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .modal-field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
  .modal-field label{ font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em;}

  /* Calendrier */
  .calendar-nav{ display:flex; align-items:center; justify-content:space-between; background:var(--gold); color:#fff;
    border-radius:8px; padding:10px 16px; margin-bottom:14px; font-weight:600; font-family:'Inter', sans-serif; font-size:15px;}
  .calendar-nav button{ background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:2px 12px; line-height:1;}
  .calendar-nav button:hover{ opacity:0.8; }
  .calendar-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .calendar-dow{ background:var(--paper-dark); text-align:center; font-size:10.5px; font-weight:700; padding:6px 2px; color:var(--ink-soft); text-transform:uppercase;}
  .calendar-cell{ background:var(--card); min-height:62px; padding:5px 4px; font-size:11px; position:relative;}
  .calendar-cell.empty{ background:var(--paper); }
  .calendar-cell.has-data{ cursor:pointer; }
  .calendar-cell.has-data:hover{ background:var(--gold-pale); }
  .calendar-cell.today{ box-shadow:inset 0 0 0 2px var(--gold); }
  .calendar-daynum{ font-weight:600; font-size:11px; color:var(--ink-soft);}
  .calendar-in{ color:var(--sage); font-family:'IBM Plex Mono',monospace; font-size:9.5px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .calendar-out{ color:var(--rust); font-family:'IBM Plex Mono',monospace; font-size:9.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .calendar-footer{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .calendar-footer .stat{ flex:1; min-width:120px; text-align:center; padding:12px; border-radius:8px; border:1.5px solid var(--line); background:var(--card);}
  .calendar-footer .stat .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); font-weight:600; margin-bottom:4px;}
  .calendar-footer .stat .num{ font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:700;}

    try{ return localStorage.getItem(SYNC_CODE_KEY) || null; }catch(e){ return null; }
  }
  function setSyncCodeLocal(code){
    try{ if(code) localStorage.setItem(SYNC_CODE_KEY, code); else localStorage.removeItem(SYNC_CODE_KEY); }catch(e){}
  }
  function syncStatusLabel(status){
    switch(status){
      case 'none': return 'Aucun code de synchronisation configuré sur cet appareil.';
      case 'syncing': return '🔄 Synchronisation en cours...';
      case 'synced': return '✅ Synchronisé avec Supabase.';
      case 'error': return '❌ Erreur de synchronisation (vérifie le code et ta connexion).';
      case 'offline': return '⚠️ Hors ligne — sera synchronisé dès la reconnexion.';
      default: return '';
    }
  }
  function setSyncStatus(status){
    state.syncStatus = status;
    var el = document.getElementById('sync-status-text');
    if(el) el.textContent = syncStatusLabel(status);
  }
  function mergeArraysById(localArr, remoteArr, preferRemote){
    localArr = localArr || []; remoteArr = remoteArr || [];
    var map = {};
    var base = preferRemote ? localArr : remoteArr;
    var overlay = preferRemote ? remoteArr : localArr;
    base.forEach(function(item){ if(item && item.id) map[item.id] = item; });
    overlay.forEach(function(item){ if(item && item.id) map[item.id] = item; });
    return Object.keys(map).map(function(k){ return map[k]; });
  }
  function deepMergeObj(a, b){
    var result = Object.assign({}, a||{});
    Object.keys(b||{}).forEach(function(k){
      if(result[k] && typeof result[k]==='object' && typeof b[k]==='object' && !Array.isArray(b[k])){
        result[k] = deepMergeObj(result[k], b[k]);
      } else {
        result[k] = b[k];
      }
    });
    return result;
  }
  function pickPreferred(preferRemote, localVal, remoteVal){
    var primary = preferRemote ? remoteVal : localVal;
    var secondary = preferRemote ? localVal : remoteVal;
    return (primary !== undefined && primary !== null) ? primary : secondary;
  }
  function mergeDataSets(local, remote, remoteIsNewer){
    local = local || {}; remote = remote || {};
    var pr = !!remoteIsNewer;
    return {
      accounts: mergeArraysById(local.accounts, remote.accounts, pr),
      categories: mergeArraysById(local.categories, remote.categories, pr),
      plans: mergeArraysById(local.plans, remote.plans, pr),
      envelopes: mergeArraysById(local.envelopes, remote.envelopes, pr),
      transactions: mergeArraysById(local.transactions, remote.transactions, pr),
      recurringTemplates: mergeArraysById(local.recurringTemplates, remote.recurringTemplates, pr),
      notes: mergeArraysById(local.notes, remote.notes, pr),
      monthlyBudgets: deepMergeObj(pr ? local.monthlyBudgets : remote.monthlyBudgets, pr ? remote.monthlyBudgets : local.monthlyBudgets),
      pin: pickPreferred(pr, local.pin, remote.pin),
      selectedMonth: pickPreferred(pr, local.selectedMonth, remote.selectedMonth),
      foiMultiplier: pickPreferred(pr, local.foiMultiplier, remote.foiMultiplier)
    };
  }
  function buildDataObj(){
    return {
      accounts: state.accounts, categories: state.categories,
      plans: state.plans, envelopes: state.envelopes, monthlyBudgets: state.monthlyBudgets,
      transactions: state.transactions, recurringTemplates: state.recurringTemplates, notes: state.notes, pin: state.pin, selectedMonth: state.selectedMonth,
      foiMultiplier: state.foiMultiplier
    };
  }
  function fetchWithTimeout(url, options, timeoutMs){
    var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var opts = Object.assign({}, options || {});
    if(controller) opts.signal = controller.signal;
    var timer = controller ? setTimeout(function(){ controller.abort(); }, timeoutMs || 6000) : null;
    return fetch(url, opts).finally(function(){ if(timer) clearTimeout(timer); });
  }
  async function pushToSupabase(dataObj, ts){
    var code = getSyncCode();
    if(!code){ setSyncStatus('none'); return; }
    setSyncStatus('syncing');
    try{
      var res = await fetchWithTimeout(SUPABASE_URL + '/rest/v1/app_data', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify([{ sync_code: code, payload: dataObj, updated_at: ts }])
      }, 6000);
      setSyncStatus(res.ok ? 'synced' : 'error');
    }catch(e){
      setSyncStatus('offline');
    }
  }
  async function pullFromSupabase(code){
    try{
      var res = await fetchWithTimeout(SUPABASE_URL + '/rest/v1/app_data?sync_code=eq.' + encodeURIComponent(code) + '&select=payload,updated_at', {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
      }, 6000);
      if(!res.ok) return null;
      var arr = await res.json();
      if(!arr.length) return null;
      return arr[0];
    }catch(e){
      return null;
    }
  }
  var saveInFlight = false;
  async function doSave(){
    if(saveInFlight){ clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 500); return; }
    saveInFlight = true;
    try{
      var ts = new Date().toISOString();
      var dataObj = buildDataObj();
      var payload = JSON.stringify(dataObj);
      localStorage.setItem(STORAGE_KEY, payload);
      localStorage.setItem(STORAGE_TS_KEY, ts);
      setSaveDot(false);
      await pushToSupabase(dataObj, ts);
    }catch(e){
      console.error("Erreur de sauvegarde:", e);
      var txt = document.getElementById("save-text");
      if(txt) txt.textContent = "Non sauvegardé (erreur)";
    }finally{
      saveInFlight = false;
    }
  }

  function migrateToV3(data){
    // v1 (liste plate) -> v3 (plans+envelopes+journal)
    if(data.plans && data.plans.length) return data;
    if(!data.envelopes) return data;
    var planId = uid();
    var migratedPlans = [{id: planId, name:"Plan Mensuel (Personnel)", type:"mensuel", description:"Enveloppes budgétaires récurrentes."}];
    var migratedEnvelopes = data.envelopes.map(function(e){ return {id: uid(), planId: planId, code:e.code, destination:e.destination, description:e.description, budget:e.budget}; });
    var migratedJournal = (data.journal||[]).map(function(j){ return {id:j.id||uid(), date:j.date, mois:j.mois, planId:planId, code:j.code, montant:j.montant, note:j.note, sens:"entree"}; });
    var migratedMonthlyBudgets = {};
    if(data.monthlyBudgets) migratedMonthlyBudgets[planId] = data.monthlyBudgets;
    var projetPlanId = uid();
    migratedPlans.push({id: projetPlanId, name:"Plan de Projets (Semences)", type:"projet", description:"Dons et projets ponctuels, financés petit à petit jusqu'au montant cible."});
    DEFAULT_PROJET_ENVELOPES.forEach(function(e){ migratedEnvelopes.push({id: uid(), planId: projetPlanId, code:e.code, destination:e.destination, description:e.description, budget:e.budget}); });
    return { plans: migratedPlans, envelopes: migratedEnvelopes, monthlyBudgets: migratedMonthlyBudgets, journal: migratedJournal, selectedMonth: data.selectedMonth || "Août 2026" };
  }

  function monthLabelFromDate(dateStr){
    if(!dateStr) return "";
    var parts = String(dateStr).split('-');
    var y = parseInt(parts[0],10), m = parseInt(parts[1],10);
    if(!y || !m || m<1 || m>12) return "";
    return MOIS_NOMS[m-1] + " " + y;
  }

  function migrateToV4(data){
    // v3 (plans+envelopes+journal) -> v4 (accounts+categories+transactions)
    if(data.transactions) {
      if(!data.accounts || !data.accounts.length){
        var accPerso = {id: uid(), name:"Portefeuille (Personnel)", icon:"👛", soldeInitial:0};
        data.accounts = [accPerso];
      }
      if(!data.categories || !data.categories.length){
        data.categories = [];
        DEFAULT_CATEGORIES_SEED.entree.forEach(function(c){ data.categories.push({id:uid(), type:"entree", name:c.name, subcategories:c.subcategories.slice(), isRetraitFoi:!!c.isRetraitFoi}); });
        DEFAULT_CATEGORIES_SEED.sortie.forEach(function(c){ data.categories.push({id:uid(), type:"sortie", name:c.name, subcategories:c.subcategories.slice(), isSemence:!!c.isSemence}); });
      }
      return data;
    }
    var defaultAccount = {id: uid(), name:"Portefeuille (Personnel)", icon:"👛", soldeInitial:0};
    var categories = [];
    DEFAULT_CATEGORIES_SEED.entree.forEach(function(c){ categories.push({id:uid(), type:"entree", name:c.name, subcategories:c.subcategories.slice(), isRetraitFoi:!!c.isRetraitFoi}); });
    DEFAULT_CATEGORIES_SEED.sortie.forEach(function(c){ categories.push({id:uid(), type:"sortie", name:c.name, subcategories:c.subcategories.slice(), isSemence:!!c.isSemence}); });
    var catNonEntree = "Autre entrée", catNonSortie = "Autre dépense";
    var transactions = (data.journal || []).map(function(j){
      var isSortie = j.sens === "sortie";
      return {
        id: j.id || uid(), date: j.date || "2026-08-01", type: isSortie ? "sortie" : "entree",
        accountId: defaultAccount.id, accountToId: null, amount: Number(j.montant)||0,
        category: isSortie ? catNonSortie : catNonEntree, subcategory: "",
        party: "", payment: "", note: j.note || "",
        planId: j.planId || null, envelopeCode: j.code || null
      };
    });
    return {
      accounts: [defaultAccount], categories: categories,
      plans: data.plans || [], envelopes: data.envelopes || [], monthlyBudgets: data.monthlyBudgets || {},
      transactions: transactions, selectedMonth: data.selectedMonth || "Août 2026"
    };
  }

  async function mergeSync(){
    var code = getSyncCode();
    if(!code) return;
    setSyncStatus('syncing');
    var remote = await pullFromSupabase(code);
    if(remote && remote.payload){
      var localObj = buildDataObj();
      var localTs = null;
      try{ localTs = localStorage.getItem(STORAGE_TS_KEY); }catch(e){}
      var remoteIsNewer = !!(remote.updated_at && (!localTs || remote.updated_at > localTs));
      var merged = mergeDataSets(localObj, remote.payload, remoteIsNewer);
      applyDataToState(merged);
    }
    await doSave();
    render();
  }
  async function activateSync(){
    var input = document.getElementById('sync-code-input');
    if(!input) return;
    var code = (input.value || '').trim();
    if(!code){ alert('Entre un code de synchronisation.'); return; }
    setSyncCodeLocal(code);
    await mergeSync();
  }
  async function manualSync(){
    var code = getSyncCode();
    if(!code){ alert('Configure d\'abord un code de synchronisation.'); return; }
    await mergeSync();
  }
  function disableSyncOnDevice(){
    if(!confirm('Désactiver la synchronisation sur cet appareil ? Tes données resteront disponibles sur Supabase, mais cet appareil ne synchronisera plus tant que tu ne resaisis pas le code.')) return;
    setSyncCodeLocal(null);
    setSyncStatus('none');
    render();
  }
  async function forcePushOverwrite(){
    var input = document.getElementById('sync-code-input');
    var code = getSyncCode() || (input ? input.value.trim() : '');
    if(!code){ alert('Entre d\'abord un code de synchronisation.'); return; }
    if(!confirm('Ceci va REMPLACER les données sur Supabase par celles de CET appareil uniquement, sans les fusionner avec ce qui existe déjà à distance ni sur tes autres appareils.\n\nN\'utilise ceci que si tu es certaine que les données de cet appareil sont les bonnes (ex. nettoyage de doublons). Continuer ?')) return;
    setSyncCodeLocal(code);
    setSyncStatus('syncing');
    var ts = new Date().toISOString();
    var dataObj = buildDataObj();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(dataObj)); localStorage.setItem(STORAGE_TS_KEY, ts); }catch(e){}
    await pushToSupabase(dataObj, ts);
    render();
  }
  function applyDataToState(data){
    state.accounts = data.accounts || [];
    state.categories = data.categories || [];
    state.plans = data.plans || [];
    state.envelopes = data.envelopes || [];
    state.monthlyBudgets = data.monthlyBudgets || {};
    state.transactions = data.transactions || [];
    state.recurringTemplates = data.recurringTemplates || [];
    state.notes = data.notes || [];
    state.pin = data.pin || null;
    state.selectedMonth = data.selectedMonth || "Août 2026";
    state.foiMultiplier = data.foiMultiplier || 100;
    state.selectedPlanId = state.plans.length ? state.plans[0].id : null;
  }
  async function loadData(){
    try{
      var localRaw = null, localTs = null;
      try{ localRaw = localStorage.getItem(STORAGE_KEY); localTs = localStorage.getItem(STORAGE_TS_KEY); }catch(e){}
      var localData = null;
      if(localRaw){
        localData = JSON.parse(localRaw);
        localData = migrateToV3(localData);
        localData = migrateToV4(localData);
      }

      var code = getSyncCode();

      if(!localData && !code){
        // Nouvel appareil : ni données locales, ni code de synchro renseigné.
        // On NE sème PAS d'exemples tant qu'on n'a pas laissé une chance de récupérer les vraies données.
        state.needsOnboarding = true;
        state.loaded = true;
        render();
        return;
      }

      var remote = code ? await pullFromSupabase(code) : null;

      var dataToUse = localData;
      if(remote && remote.payload){
        var remoteIsNewer = !!(remote.updated_at && (!localTs || remote.updated_at > localTs));
        dataToUse = mergeDataSets(localData || {}, remote.payload, remoteIsNewer);
        setSyncStatus('synced');
      }

      if(dataToUse && ((dataToUse.accounts && dataToUse.accounts.length) || (dataToUse.transactions && dataToUse.transactions.length))){
        applyDataToState(dataToUse);
        await doSave();
      } else {
        seedDefaults();
        await doSave();
      }
    }catch(e){
      console.log("Aucune donnée existante, initialisation avec les valeurs par défaut.", e);
      seedDefaults();
      await doSave();
    }
    state.locked = !!state.pin;
    state.loaded = true;
    render();
  }

  /* ======================================================================
     HELPERS
     ====================================================================== */
  function fmt(n){ n = Math.round(Number(n) || 0); return n.toLocaleString('fr-FR') + " FCFA"; }
  function fmtAscii(n){
    n = Math.round(Number(n) || 0);
    var neg = n < 0; n = Math.abs(n);
    var s = String(n), parts = [];
    while(s.length > 3){ parts.unshift(s.slice(-3)); s = s.slice(0, -3); }
    parts.unshift(s);
    return (neg?'-':'') + parts.join(' ') + ' FCFA';
  }
  function fmtPct(p){ return Math.round(p*1000)/10 + "%"; }

  function envelopesFor(planId){ return state.envelopes.filter(function(e){ return e.planId === planId; }); }
  function getPlan(id){ return state.plans.find(function(p){ return p.id === id; }); }
  function deletePlanById(planId){
    state.plans = state.plans.filter(function(p){ return p.id !== planId; });
    state.envelopes = state.envelopes.filter(function(e){ return e.planId !== planId; });
    delete state.monthlyBudgets[planId];
    if(state.selectedPlanId === planId) state.selectedPlanId = state.plans.length ? state.plans[0].id : null;
  }
  function getAccount(id){ return state.accounts.find(function(a){ return a.id === id; }); }
  function categoriesFor(type){ return state.categories.filter(function(c){ return c.type === type; }); }

  function accountBalance(account){
    var bal = Number(account.soldeInitial) || 0;
    state.transactions.forEach(function(t){
      if(t.type === "transfert"){
        if(t.accountId === account.id) bal -= Number(t.amount)||0;
        if(t.accountToId === account.id) bal += Number(t.amount)||0;
      } else if(t.accountId === account.id){
        bal += (t.type === "entree" ? 1 : -1) * (Number(t.amount)||0);
      }
    });
    return bal;
  }

  /* --- Types "mensuel" / "projet" : cotisation nette vers un objectif --- */
  function getBudget(plan, env, month){
    if(plan.type === "mensuel"){
      var byPlan = state.monthlyBudgets[plan.id];
      var byMonth = byPlan && byPlan[month];
      var ov = byMonth && byMonth[env.code];
      if(ov !== undefined && ov !== null && ov !== "") return Number(ov);
    }
    return Number(env.budget) || 0;
  }
  function setBudget(plan, env, month, value){
    if(plan.type === "mensuel"){
      if(!state.monthlyBudgets[plan.id]) state.monthlyBudgets[plan.id] = {};
      if(!state.monthlyBudgets[plan.id][month]) state.monthlyBudgets[plan.id][month] = {};
      state.monthlyBudgets[plan.id][month][env.code] = value;
    } else { env.budget = value; }
  }
  function getCotise(plan, env, month){
    return state.transactions
      .filter(function(t){
        if(t.type === "transfert" || t.planId !== plan.id || t.envelopeCode !== env.code) return false;
        if(plan.type === "mensuel") return monthLabelFromDate(t.date) === month;
        return true;
      })
      .reduce(function(sum, t){ return sum + (t.type === "sortie" ? 1 : -1) * (Number(t.amount)||0); }, 0);
  }
  /* --- Type "budget" : reçu puis dépensé --- */
  function getRecu(plan, env, month){
    return state.transactions
      .filter(function(t){
        if(t.planId!==plan.id || t.envelopeCode!==env.code || monthLabelFromDate(t.date)!==month) return false;
        return t.type==="entree" || (t.type==="sortie" && t.envelopeRecu===true);
      })
      .reduce(function(sum,t){ return sum + (Number(t.amount)||0); }, 0);
  }
  function getDepense(plan, env, month){
    return state.transactions
      .filter(function(t){ return t.type==="sortie" && !t.envelopeRecu && t.planId===plan.id && t.envelopeCode===env.code && monthLabelFromDate(t.date)===month; })
      .reduce(function(sum,t){ return sum + (Number(t.amount)||0); }, 0);
  }
  function statutFor(pct){
    if(pct <= 0) return {label:"Non commencée", cls:"none"};
    if(pct >= 1) return {label: pct > 1 ? "Dépassée" : "Complétée", cls: pct > 1 ? "over" : "complete"};
    return {label:"En cours", cls:"progress"};
  }
  function statutForBudget(recu, depense){
    if(recu <= 0) return {label:"Vide", cls:"none"};
    if(depense <= 0) return {label:"Non entamée", cls:"none"};
    if(depense > recu) return {label:"Dépassée", cls:"over"};
    if(depense === recu) return {label:"Épuisée", cls:"complete"};
    return {label:"En cours", cls:"progress"};
  }
  function planTotals(plan, month){
    var envs = envelopesFor(plan.id);
    if(plan.type === "budget"){
      var recu=0, depense=0;
      envs.forEach(function(env){ recu += getRecu(plan, env, month); depense += getDepense(plan, env, month); });
      return {kind:"budget", recu:recu, depense:depense, reste:recu-depense, pct: recu>0 ? depense/recu : 0, count: envs.length};
    }
    var b=0, c=0;
    envs.forEach(function(env){ b += getBudget(plan, env, month); c += getCotise(plan, env, month); });
    return {kind:"cotisation", budget:b, cotise:c, reste:b-c, pct: b>0 ? c/b : 0, count: envs.length};
  }
  function computeUnallocatedMoney(){
    var refMonth = monthLabelFromDate(todayIsoLocal());
    var totalSolde = 0;
    state.accounts.forEach(function(a){ totalSolde += accountBalance(a); });
    var totalNeeded = 0;
    state.plans.forEach(function(plan){
      if(plan.type !== 'mensuel' && plan.type !== 'budget') return;
      var t = planTotals(plan, refMonth);
      totalNeeded += Math.max(0, t.reste);
    });
    return { solde: totalSolde, needed: totalNeeded, unallocated: totalSolde - totalNeeded, refMonth: refMonth };
  }

  function formatDateFr(d){ return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'}); }
  function todayIsoLocal(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function isoDate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

  function allCategoryNames(sens){
    var names = {};
    state.categories.forEach(function(c){
      if(sens==="Tous" || c.type===sens) names[c.name]=true;
    });
    return Object.keys(names).sort();
  }
  function allSubcategoryNames(sens, selectedCategories){
    var names = {};
    state.categories.forEach(function(c){
      if(sens!=="Tous" && c.type!==sens) return;
      if(selectedCategories && selectedCategories.length && selectedCategories.indexOf(c.name)===-1) return;
      (c.subcategories||[]).forEach(function(s){ names[s]=true; });
    });
    return Object.keys(names).sort();
  }

  var PERIOD_PRESETS = [
    {value:"Tous", label:"Toutes (depuis le début)"},
    {value:"aujourdhui", label:"Aujourd'hui"},
    {value:"semaine", label:"Cette semaine"},
    {value:"mois", label:"Ce mois-ci"},
    {value:"mois_dernier", label:"Le mois dernier"},
    {value:"annee", label:"Cette année"},
    {value:"personnalise", label:"Période personnalisée…"}
  ];

  function getPeriodRange(f){
    var today = new Date(); today.setHours(0,0,0,0);
    if(f.periodeType === "aujourdhui"){ var s = isoDate(today); return [s, s]; }
    if(f.periodeType === "semaine"){
      var day = (today.getDay()+6) % 7;
      var monday = new Date(today); monday.setDate(today.getDate()-day);
      var sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
      return [isoDate(monday), isoDate(sunday)];
    }
    if(f.periodeType === "mois"){
      var start = new Date(today.getFullYear(), today.getMonth(), 1);
      var end = new Date(today.getFullYear(), today.getMonth()+1, 0);
      return [isoDate(start), isoDate(end)];
    }
    if(f.periodeType === "mois_dernier"){
      var start2 = new Date(today.getFullYear(), today.getMonth()-1, 1);
      var end2 = new Date(today.getFullYear(), today.getMonth(), 0);
      return [isoDate(start2), isoDate(end2)];
    }
    if(f.periodeType === "annee"){
      return [today.getFullYear()+"-01-01", today.getFullYear()+"-12-31"];
    }
    if(f.periodeType === "personnalise"){
      return [f.periodeStart || null, f.periodeEnd || null];
    }
    return [null, null];
  }
  function periodeLabelText(f){
    var preset = PERIOD_PRESETS.find(function(p){ return p.value===f.periodeType; });
    if(f.periodeType === "personnalise"){
      if(f.periodeStart && f.periodeEnd) return "Du " + f.periodeStart + " au " + f.periodeEnd;
      if(f.periodeStart) return "Depuis le " + f.periodeStart;
      if(f.periodeEnd) return "Jusqu'au " + f.periodeEnd;
      return "Période personnalisée (non définie)";
    }
    return preset ? preset.label : "Toutes";
  }

  function dateInRangeArr(date, range){
    if(!date) return false;
    if(range[0] && date < range[0]) return false;
    if(range[1] && date > range[1]) return false;
    return true;
  }
  function computeReferenceMonth(f){
    var today = new Date();
    if(f.periodeType === "mois_dernier"){
      var d = new Date(today.getFullYear(), today.getMonth()-1, 1);
      return MOIS_NOMS[d.getMonth()] + " " + d.getFullYear();
    }
    if(f.periodeType === "personnalise" && f.periodeStart && f.periodeEnd && f.periodeStart.slice(0,7)===f.periodeEnd.slice(0,7)){
      return monthLabelFromDate(f.periodeStart);
    }
    return monthLabelFromDate(todayIsoLocal());
  }
  function getCotiseInRange(plan, env, range){
    return state.transactions.filter(function(t){
      return t.type!=='transfert' && t.planId===plan.id && t.envelopeCode===env.code && dateInRangeArr(t.date, range);
    }).reduce(function(sum,t){ return sum + (t.type==='sortie'?1:-1) * (Number(t.amount)||0); }, 0);
  }
  function getRecuInRange(plan, env, range){
    return state.transactions.filter(function(t){
      if(t.planId!==plan.id || t.envelopeCode!==env.code || !dateInRangeArr(t.date, range)) return false;
      return t.type==='entree' || (t.type==='sortie' && t.envelopeRecu===true);
    }).reduce(function(sum,t){ return sum + (Number(t.amount)||0); }, 0);
  }
  function getDepenseInRange(plan, env, range){
    return state.transactions.filter(function(t){ return t.type==='sortie' && !t.envelopeRecu && t.planId===plan.id && t.envelopeCode===env.code && dateInRangeArr(t.date, range); })
      .reduce(function(sum,t){ return sum + (Number(t.amount)||0); }, 0);
  }
  function planTotalsForRange(plan, range, refMonth){
    var envs = envelopesFor(plan.id);
    var effectiveRange = (plan.type === "projet" || plan.type === "budget") ? [null,null] : range;
    if(plan.type === "budget"){
      var recu=0, depense=0;
      envs.forEach(function(env){ recu += getRecuInRange(plan, env, effectiveRange); depense += getDepenseInRange(plan, env, effectiveRange); });
      return {kind:"budget", recu:recu, depense:depense, reste:recu-depense, pct: recu>0 ? depense/recu : 0, count: envs.length};
    }
    var b=0, c=0;
    envs.forEach(function(env){ b += getBudget(plan, env, refMonth); c += getCotiseInRange(plan, env, effectiveRange); });
    return {kind:"cotisation", budget:b, cotise:c, reste:b-c, pct: b>0 ? c/b : 0, count: envs.length};
  }
  function accountFlowsInRange(account, range){
    var entrees=0, sorties=0;
    state.transactions.forEach(function(t){
      if(!dateInRangeArr(t.date, range)) return;
      if(t.type === "transfert"){
        if(t.accountId === account.id) sorties += Number(t.amount)||0;
        if(t.accountToId === account.id) entrees += Number(t.amount)||0;
      } else if(t.accountId === account.id){
        if(t.type === "entree") entrees += Number(t.amount)||0; else sorties += Number(t.amount)||0;
      }
    });
    return {entrees:entrees, sorties:sorties};
  }

  /* --- Crédit de Foi : Semences x100 / Retraits (Moisson) --- */
  function isCategorieSemence(categoryName){
    var cat = state.categories.find(function(c){ return c.type==='sortie' && c.name===categoryName; });
    return !!(cat && cat.isSemence);
  }
  function isCategorieRetraitFoi(categoryName){
    var cat = state.categories.find(function(c){ return c.type==='entree' && c.name===categoryName; });
    return !!(cat && cat.isRetraitFoi);
  }
  function buildFoiLedger(){
    var multiplier = Number(state.foiMultiplier) || 100;
    var entries = state.transactions.filter(function(t){
      if(t.type === 'sortie') return isCategorieSemence(t.category) && !isEnvelopeSpendAlreadyCounted(t);
      if(t.type === 'entree') return isCategorieRetraitFoi(t.category);
      return false;
    }).slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||"") || String(a.id).localeCompare(String(b.id)); });
    var running = 0;
    return entries.map(function(t){
      var seme = t.type === 'sortie' ? (Number(t.amount)||0) : 0;
      var credit = seme * multiplier;
      var retrait = t.type === 'entree' ? (Number(t.amount)||0) : 0;
      running += credit - retrait;
      return {
        id: t.id, date: t.date, type: t.type, category: t.category, accountId: t.accountId || null,
        label: t.note || t.category || (t.type==='sortie' ? 'Semence' : 'Retrait'),
        seme: seme, multiplier: multiplier, credit: credit, retrait: retrait, solde: running
      };
    });
  }
  function foiTotalsAllTime(ledger){
    var totalSeme=0, totalCredit=0, totalRetrait=0;
    ledger.forEach(function(l){ totalSeme += l.seme; totalCredit += l.credit; totalRetrait += l.retrait; });
    return { totalSeme:totalSeme, totalCredit:totalCredit, totalRetrait:totalRetrait, solde: ledger.length ? ledger[ledger.length-1].solde : 0 };
  }
  function foiTotalsForRange(ledger, range){
    var seme=0, credit=0, retrait=0;
    ledger.forEach(function(l){ if(dateInRangeArr(l.date, range)){ seme += l.seme; credit += l.credit; retrait += l.retrait; } });
    return { seme:seme, credit:credit, retrait:retrait, net: credit-retrait };
  }
  function foiSoldeAsOf(ledger, endDate){
    var val = 0;
    for(var i=0;i<ledger.length;i++){
      if(endDate && ledger[i].date > endDate) break;
      val = ledger[i].solde;
    }
    return val;
  }
  function foiTotalsByAccount(ledger, range){
    var groups = {};
    ledger.forEach(function(l){
      var key = l.accountId || '_none';
      if(!groups[key]) groups[key] = [];
      groups[key].push(l);
    });
    var results = [];
    Object.keys(groups).forEach(function(key){
      var arr = groups[key].slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
      var running = 0, periodSeme=0, periodCredit=0, periodRetrait=0;
      arr.forEach(function(l){
        running += l.credit - l.retrait;
        l._accSolde = running;
        if(dateInRangeArr(l.date, range)){ periodSeme += l.seme; periodCredit += l.credit; periodRetrait += l.retrait; }
      });
      var soldeAsOf = 0;
      for(var i=0;i<arr.length;i++){
        if(range[1] && arr[i].date > range[1]) break;
        soldeAsOf = arr[i]._accSolde;
      }
      var account = key === '_none' ? null : getAccount(key);
      results.push({
        accountId: key === '_none' ? null : key,
        accountName: account ? account.name : 'Sans compte (espèces)',
        accountIcon: account ? account.icon : '💵',
        seme: periodSeme, credit: periodCredit, retrait: periodRetrait, net: periodCredit-periodRetrait,
        solde: soldeAsOf
      });
    });
    results.sort(function(a,b){
      if(a.accountId===null) return 1;
      if(b.accountId===null) return -1;
      return a.accountName.localeCompare(b.accountName);
    });
    return results;
  }
  function foiFilterLedgerByAccount(ledger, filterValue){
    if(!filterValue || filterValue === "Tous") return ledger;
    if(filterValue === "_none") return ledger.filter(function(l){ return !l.accountId; });
    return ledger.filter(function(l){ return l.accountId === filterValue; });
  }
  function foiAccountFilterLabel(filterValue){
    if(!filterValue || filterValue === "Tous") return "Tous les comptes";
    if(filterValue === "_none") return "Sans compte (espèces)";
    var a = getAccount(filterValue);
    return a ? a.name : "Compte supprimé";
  }

  function transactionMatchesFilters(t){
    var f = state.txFilters;
    if(f.compte !== "Tous"){
      if(t.type === "transfert"){ if(t.accountId!==f.compte && t.accountToId!==f.compte) return false; }
      else if(t.accountId !== f.compte) return false;
    }
    if(f.sens !== "Tous" && t.type !== f.sens) return false;
    if(f.categories && f.categories.length > 0 && f.categories.indexOf(t.category) === -1) return false;
    if(f.subcategories && f.subcategories.length > 0 && f.subcategories.indexOf(t.subcategory) === -1) return false;
    var range = getPeriodRange(f);
    if(range[0] && t.date < range[0]) return false;
    if(range[1] && t.date > range[1]) return false;
    if(state.txSearchQuery){
      var q = state.txSearchQuery.toLowerCase();
      var acc = getAccount(t.accountId), accTo = getAccount(t.accountToId);
      var plan = t.planId ? getPlan(t.planId) : null;
      var env = plan ? state.envelopes.find(function(e){ return e.planId===plan.id && e.code===t.envelopeCode; }) : null;
      var hay = [t.category, t.subcategory, t.party, t.payment, t.note, acc?acc.name:'', accTo?accTo.name:'', plan?plan.name:'', env?env.destination:'', t.date, String(t.amount)].join(' ').toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }
  function sortTransactionsRecentFirst(arr){
    // La plus récemment enregistrée en premier ; à date égale, on garde l'ordre d'ajout (la plus récente saisie au-dessus).
    var reversed = arr.slice().reverse();
    reversed.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
    return reversed;
  }
  function getFilteredTransactions(){
    return sortTransactionsRecentFirst(state.transactions.filter(transactionMatchesFilters));
  }

  function filterSummaryLines(){
    var f = state.txFilters;
    var acc = f.compte !== "Tous" ? getAccount(f.compte) : null;
    var compteLabel = f.compte === "Tous" ? "Tous les comptes" : (acc ? acc.name : "Compte supprimé");
    var sensLabel = f.sens === "Tous" ? "Entrées et sorties" : (f.sens==="entree" ? "Entrées uniquement" : (f.sens==="sortie" ? "Sorties uniquement" : "Transferts uniquement"));
    var catLabel = (f.categories && f.categories.length) ? f.categories.join(", ") : "Toutes catégories";
    var subcatLabel = (f.subcategories && f.subcategories.length) ? f.subcategories.join(", ") : "Toutes sous-catégories";
    var searchLabel = state.txSearchQuery ? (" — Recherche : \"" + state.txSearchQuery + "\"") : "";
    return {
      compte: compteLabel, sens: sensLabel, categorie: catLabel, sousCategorie: subcatLabel, periode: periodeLabelText(f),
      line: "Compte : " + compteLabel + "  |  Sens : " + sensLabel + "  |  Catégories : " + catLabel + "  |  Sous-catégories : " + subcatLabel + "  |  Période : " + periodeLabelText(f) + searchLabel
    };
  }

  function isEnvelopeSpendAlreadyCounted(t){
    if(t.type !== 'sortie' || t.accountId) return false;
    if(!t.planId) return false;
    var plan = getPlan(t.planId);
    return !!(plan && plan.type === 'budget');
  }
  function categoryTotals(type, month){
    var totals = {};
    state.transactions.forEach(function(t){
      if(t.type !== type) return;
      if(monthLabelFromDate(t.date) !== month) return;
      if(isEnvelopeSpendAlreadyCounted(t)) return;
      var key = t.category || "Non catégorisé";
      totals[key] = (totals[key]||0) + (Number(t.amount)||0);
    });
    return Object.keys(totals).map(function(k){ return {category:k, total:totals[k]}; }).sort(function(a,b){ return b.total-a.total; });
  }

  async function onboardingRecover(){
    var input = document.getElementById('onboarding-sync-code');
    var code = (input ? input.value : '').trim();
    if(!code){ state.onboardingError = 'Entre ton code de synchronisation.'; render(); return; }
    setSyncCodeLocal(code);
    state.onboardingError = null;
    var remote = await pullFromSupabase(code);
    if(remote && remote.payload){
      applyDataToState(remote.payload);
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(remote.payload)); localStorage.setItem(STORAGE_TS_KEY, remote.updated_at); }catch(e){}
      setSyncStatus('synced');
      state.needsOnboarding = false;
      state.locked = !!state.pin;
      await doSave();
      render();
    } else {
      setSyncCodeLocal(null);
      state.onboardingError = 'Aucune donnée trouvée pour ce code. Vérifie qu\'il est identique à celui utilisé sur tes autres appareils, ou clique "Découvrir l\'app avec des exemples" si c\'est un tout nouveau départ.';
      render();
    }
  }

    html += '<p class="desc">Tes comptes et l\'état de chaque plan d\'enveloppes, pour ' + refMonth + '.</p>';

    var totalBalance = 0;
    state.accounts.forEach(function(a){ totalBalance += accountBalance(a); });
    var totalIn = 0, totalOut = 0, lastMonthOut = 0, lastMonthIn = 0;
    var lastMonthDate = new Date(today.getFullYear(), today.getMonth()-1, 1);
    var lastMonthRange = [
      lastMonthDate.getFullYear() + '-' + pad2(lastMonthDate.getMonth()+1) + '-01',
      lastMonthDate.getFullYear() + '-' + pad2(lastMonthDate.getMonth()+1) + '-' + pad2(new Date(lastMonthDate.getFullYear(), lastMonthDate.getMonth()+1, 0).getDate())
    ];
    state.transactions.forEach(function(t){
      if(t.type === 'transfert') return;
      if(isEnvelopeSpendAlreadyCounted(t)) return;
      if(dateInRangeArr(t.date, range)){
        if(t.type==='entree') totalIn += Number(t.amount)||0; else totalOut += Number(t.amount)||0;
      }
      if(t.type==='sortie' && dateInRangeArr(t.date, lastMonthRange)) lastMonthOut += Number(t.amount)||0;
      if(t.type==='entree' && dateInRangeArr(t.date, lastMonthRange)) lastMonthIn += Number(t.amount)||0;
    });
    var totalBudgetReste = 0, totalBudgetRecu = 0;
    state.plans.filter(function(p){ return p.type==='budget'; }).forEach(function(plan){
      var t = planTotalsForRange(plan, range, refMonth);
      totalBudgetReste += t.reste; totalBudgetRecu += t.recu;
    });
    var foiLedgerDash = buildFoiLedger();
    var foiAllTimeDash = foiTotalsAllTime(foiLedgerDash);
    var foiThisMonthDash = foiTotalsForRange(foiLedgerDash, range);
    var foiLastMonthDash = foiTotalsForRange(foiLedgerDash, lastMonthRange);

    var unalloc = computeUnallocatedMoney();

    html += '<div class="summary-grid kpi-row">';
    html += '<div class="summary-card"><div class="label">Solde total</div><div class="value">' + fmt(totalBalance) + '</div><div class="delta">tous comptes confondus</div></div>';
    html += '<div class="summary-card"><div class="label">Entrées (ce mois)</div><div class="value sage">+ ' + Math.round(totalIn).toLocaleString('fr-FR') + '</div><div class="delta">vs ' + fmt(lastMonthIn) + ' le mois dernier</div></div>';
    html += '<div class="summary-card"><div class="label">Sorties (ce mois)</div><div class="value rust">− ' + Math.round(totalOut).toLocaleString('fr-FR') + '</div><div class="delta">vs ' + fmt(lastMonthOut) + ' le mois dernier</div></div>';
    html += '<div class="summary-card"><div class="label">Reste à dépenser (Budgets)</div><div class="value">' + fmt(totalBudgetReste) + '</div><div class="delta">sur ' + fmt(totalBudgetRecu) + ' reçus</div></div>';
    html += '<div class="summary-card clickable" data-tab="plans" style="cursor:pointer;"><div class="label">💰 Argent non alloué</div><div class="value ' + (unalloc.unallocated<0?'rust':'sage') + '">' + fmt(unalloc.unallocated) + '</div><div class="delta">sur ' + fmt(unalloc.needed) + ' déjà prévus ce mois</div></div>';
    html += '</div>';

    html += '<div class="two-col">';
    html += '<div class="col-main">';

    if(state.accounts.length){
      html += '<div class="section-title">Comptes <span class="link-goto" data-tab="comptes">Gérer →</span></div>';
      html += '<div class="account-grid">';
      state.accounts.forEach(function(a){
        var bal = accountBalance(a);
        var flows = accountFlowsInRange(a, range);
        html += '<div class="account-card clickable" data-open-account="' + a.id + '">';
        html += '<div class="aicon">' + a.icon + '</div><div class="aname">' + escapeHtml(a.name) + '</div>';
        html += '<div class="abal ' + (bal<0?'neg':'') + '">' + fmt(bal) + '</div>';
        html += '<div class="aflow"><span class="in">+' + fmt(flows.entrees) + '</span><span class="out">−' + fmt(flows.sorties) + '</span></div>';
        html += '</div>';
      });
      html += '</div>';
    }

    if(state.plans.length === 0){
      html += '<div class="empty-state">Aucun plan pour l\'instant. Crée ton premier plan dans l\'onglet "Plans &amp; Enveloppes".</div>';
    } else {
      html += '<div class="section-title" style="margin-top:6px;">Plans &amp; Enveloppes <span class="link-goto" data-tab="plans">Voir tout →</span></div>';
      html += '<div class="plan-grid">';
      state.plans.forEach(function(plan){
        var t = planTotalsForRange(plan, range, refMonth);
        html += '<div class="plan-card" data-open-plan="' + plan.id + '">';
        html += '<span class="type-badge ' + plan.type + '">' + typeLabel(plan.type) + '</span>';
        html += '<div class="pname">' + escapeHtml(plan.name) + '</div>';
        html += '<div class="pmeta">' + t.count + ' enveloppe' + (t.count>1?'s':'') + ((plan.type==='projet'||plan.type==='budget') ? ' · cumulé' : ' · ' + refMonth) + '</div>';
        if(t.kind === "budget"){
          html += '<div class="pnums"><span>Dépensé <b>' + fmt(t.depense) + '</b></span><span>Reçu <b>' + fmt(t.recu) + '</b></span></div>';
          html += '<div class="mini-bar-bg"><div class="mini-bar-fill ' + (t.pct>1?"over":"spend") + '" style="width:' + Math.min(100,t.pct*100) + '%"></div></div>';
          html += '<div class="preste">Solde restant : <b>' + fmt(t.reste) + '</b></div>';
        } else {
          html += '<div class="pnums"><span>Cotisé <b>' + fmt(t.cotise) + '</b></span><span>Budget <b>' + fmt(t.budget) + '</b></span></div>';
          html += '<div class="mini-bar-bg"><div class="mini-bar-fill ' + (t.pct>=1?(t.pct>1?"over":"complete"):"") + '" style="width:' + Math.min(100,t.pct*100) + '%"></div></div>';
          html += '<div class="preste">Reste à cotiser : <b>' + fmt(t.reste) + '</b></div>';
        }
        html += '</div>';
      });
      html += '<div class="add-plan-card" data-goto-newplan="1">+ Nouveau plan / projet</div>';
      html += '</div>';
    }

    html += '<div class="section-title" style="margin-top:6px;">🌾 Compte Céleste (Crédit de Foi) <span class="link-goto" data-tab="creditfoi">Voir le détail →</span></div>';
    html += '<div class="summary-grid kpi-row">';
    html += '<div class="summary-card clickable" data-tab="creditfoi" style="cursor:pointer;"><div class="label">Solde du Compte</div><div class="value gold">' + fmt(foiAllTimeDash.solde) + '</div><div class="delta">disponible à retirer</div></div>';
    html += '<div class="summary-card clickable" data-tab="creditfoi" style="cursor:pointer;"><div class="label">Semé (ce mois)</div><div class="value">' + fmt(foiThisMonthDash.seme) + '</div><div class="delta">vs ' + fmt(foiLastMonthDash.seme) + ' le mois dernier</div></div>';
    html += '<div class="summary-card clickable" data-tab="creditfoi" style="cursor:pointer;"><div class="label">Crédit Généré (x' + (Number(state.foiMultiplier)||100) + ')</div><div class="value sage">' + fmt(foiThisMonthDash.credit) + '</div><div class="delta">vs ' + fmt(foiLastMonthDash.credit) + ' le mois dernier</div></div>';
    html += '<div class="summary-card clickable" data-tab="creditfoi" style="cursor:pointer;"><div class="label">Retiré (ce mois)</div><div class="value rust">' + fmt(foiThisMonthDash.retrait) + '</div><div class="delta">vs ' + fmt(foiLastMonthDash.retrait) + ' le mois dernier</div></div>';
    html += '<div class="summary-card clickable" data-tab="creditfoi" style="cursor:pointer;"><div class="label">Semé (cumul)</div><div class="value">' + fmt(foiAllTimeDash.totalSeme) + '</div><div class="delta">depuis le début</div></div>';
    html += '<div class="summary-card clickable" data-tab="creditfoi" style="cursor:pointer;"><div class="label">Retiré (cumul)</div><div class="value rust">' + fmt(foiAllTimeDash.totalRetrait) + '</div><div class="delta">depuis le début</div></div>';
    html += '</div>';

    html += '</div>'; // col-main

    html += '<div class="col-side">';
    html += '<div class="card">';
    html += '<div class="section-title" style="margin-bottom:6px;">Transactions récentes</div>';
    var recentTx = sortTransactionsRecentFirst(state.transactions).slice(0,6);
    if(recentTx.length === 0){
      html += '<div class="empty-state" style="padding:16px;">Aucune transaction pour l\'instant.</div>';
    } else {
      html += '<div class="tx-list">';
      recentTx.forEach(function(t){
        var acc = getAccount(t.accountId);
        html += '<div class="tx-row-mini" data-view-tx="' + t.id + '">';
        html += '<div class="tx-left"><span class="tx-cat">' + escapeHtml(t.category || (t.type==='transfert'?'Transfert':'(sans catégorie)')) + '</span><span class="tx-sub">' + fmtDateFull(t.date) + (acc?' · '+escapeHtml(acc.name):'') + '</span></div>';
        html += '<span class="tx-amt-mini ' + (t.type==='entree'?'in':(t.type==='sortie'?'out':'')) + '">' + (t.type==='entree'?'+ ':(t.type==='sortie'?'− ':'')) + Math.round(t.amount).toLocaleString('fr-FR') + '</span>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    html += '<button class="btn" id="dash-add-tx-btn" style="width:100%;">+ Ajouter une transaction</button>';
    html += '<div class="card">';
    html += '<div class="section-title" style="margin-bottom:6px;">Dépenses par catégorie <span class="link-goto" data-tab="rapports">Détail →</span></div>';
    html += '<div class="chart-block"><canvas id="chart-dash-out" width="200" height="200" class="donut-canvas"></canvas>';
    html += '<div class="chart-legend" id="dash-chart-legend"></div></div>';
    html += '</div>';
    html += '</div>'; // col-side

    html += '</div>'; // two-col

    html += '<div class="footnote">Pour le détail par catégorie (et filtrable par compte ou période), rends-toi dans l\'onglet <b>Rapports</b>.</div>';

    return html;
  }
  function fmtDateFull(dateStr){
    if(!dateStr) return '';
    var d = new Date(dateStr + 'T00:00:00');
    var dows = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
    return dows[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS_NOMS[d.getMonth()].toLowerCase() + ' ' + d.getFullYear();
  }

  /* ---------- Comptes ---------- */

    var html = '';
    html += '<h2 class="title">Comptes</h2>';
    html += '<p class="desc">Tes vraies poches d\'argent : portefeuille, compte business, mobile money... Chaque transaction affecte le solde du compte choisi. Clique sur un compte pour le modifier ou le supprimer.</p>';

    if(state.accounts.length){
      html += '<div class="account-grid">';
      state.accounts.forEach(function(a){
        var bal = accountBalance(a);
        html += '<div class="account-card clickable" data-open-account="' + a.id + '">';
        html += '<div class="aicon">' + a.icon + '</div><div class="aname">' + escapeHtml(a.name) + '</div>';
        html += '<div class="abal ' + (bal<0?'neg':'') + '">' + fmt(bal) + '</div></div>';
      });
      html += '</div>';
    } else {
      html += '<div class="empty-state">Aucun compte pour l\'instant.</div>';
    }

    html += '<div style="margin-top:20px;"><button class="btn secondary" id="toggle-new-account">+ Ajouter un compte</button></div>';
    if(state.showNewAccountForm){
      html += '<div class="new-account-box">';
      html += '<div class="field full"><label>Nom du compte</label><input type="text" id="na-name" placeholder="Ex. Compte Business, Mobile Money..."></div>';
      html += '<div class="field"><label>Solde initial (FCFA)</label><input type="number" id="na-solde" value="0" step="500"></div>';
      html += '<div class="field full"><label>Icône</label><div class="icon-pick" id="na-icons">' +

      html += '</div>';
    }
    html += '<div class="footnote">Astuce : quand une dépense a déjà été retirée en espèces et mise de côté dans une enveloppe "Budget", tu peux laisser le champ Compte vide dans le formulaire de transaction — cet argent est déjà considéré comme sorti.</div>';
    return html;
  }

  /* ---------- Plans & Enveloppes ---------- */
  function renderPlans(){
    var html = '';
    html += '<h2 class="title">Plans &amp; Enveloppes</h2>';
    html += '<p class="desc">Chaque plan regroupe un ensemble d\'enveloppes, selon 3 logiques : <b>Mensuel</b> (cotiser vers un objectif, remis à zéro chaque mois), <b>Projet</b> (cotiser vers un objectif unique, cumulatif) ou <b>Budget</b> (recevoir un montant puis le dépenser au fil du mois).</p>';

    var unallocPlans = computeUnallocatedMoney();
    html += '<div class="summary-grid kpi-row" style="margin-bottom:20px;">';
    html += '<div class="summary-card"><div class="label">💰 Argent non alloué</div><div class="value ' + (unallocPlans.unallocated<0?'rust':'sage') + '">' + fmt(unallocPlans.unallocated) + '</div><div class="delta">Solde réel ' + fmt(unallocPlans.solde) + ' − ' + fmt(unallocPlans.needed) + ' déjà prévus (Mensuel + Budget, hors Projets long terme)</div></div>';
    html += '</div>';

    html += '<div class="plan-switch">';
    state.plans.forEach(function(p){ html += '<div class="plan-pill ' + (p.id===state.selectedPlanId && !state.showNewPlanForm?'active':'') + '" data-select-plan="' + p.id + '">' + escapeHtml(p.name) + '</div>'; });
    html += '<div class="plan-pill add ' + (state.showNewPlanForm?'active':'') + '" data-toggle-newplan="1">+ Nouveau plan</div>';
    html += '</div>';

    if(state.showNewPlanForm) html += renderNewPlanForm();

    if(!state.showNewPlanForm){
      var plan = getPlan(state.selectedPlanId);
      if(!plan && state.plans.length){ plan = state.plans[0]; state.selectedPlanId = plan.id; }
      if(plan) html += renderPlanDetail(plan);
      else html += '<div class="empty-state">Aucun plan encore — crée le premier avec "+ Nouveau plan".</div>';
    }
    return html;
  }

  function renderNewPlanForm(){
    var html = '<div class="new-plan-box">';
    html += '<div class="field full"><label>Nom du plan</label><input type="text" id="np-name" placeholder="Ex. Business, Maison, Épargne Voiture..."></div>';
    html += '<div class="field"><label>Type</label><select id="np-type">' +
      '<option value="mensuel">Mensuel — cotiser vers un objectif chaque mois</option>' +
      '<option value="projet">Projet — cotiser vers un objectif unique (cumulatif)</option>' +
      '<option value="budget">Budget — recevoir puis dépenser dans l\'enveloppe</option>' +
      '</select></div>';
    html += '<div class="field full"><label>Description (optionnel)</label><input type="text" id="np-desc" placeholder="À quoi sert ce plan ?"></div>';
    html += '<div class="hint" id="np-hint">Mensuel : tu suis un budget prévu par enveloppe et ce que tu as déjà cotisé ce mois-ci.</div>';
    html += '<div class="submit-row"><button class="btn secondary" id="np-cancel">Annuler</button><button class="btn" id="np-create">Créer le plan</button></div>';
    html += '</div>';
    return html;
  }

  function renderPlanDetail(plan){
    var html = '';
    var isMensuel = plan.type === "mensuel", isBudget = plan.type === "budget";
    var f = state.planPeriod;
    var range = getPeriodRange(f);
    var refMonth = computeReferenceMonth(f);
    html += '<div class="plan-detail-head">';
    html += '<div style="flex:1;min-width:220px;">';
    html += '<h2 class="title" style="font-size:19px;margin-bottom:2px;">' + escapeHtml(plan.name) + '</h2>';
    if(plan.description) html += '<p class="desc" style="margin:0;">' + escapeHtml(plan.description) + '</p>';
    html += '</div>';
    html += '<button class="btn secondary" data-open-plan-edit="' + plan.id + '">Modifier</button>';
    html += '</div>';

    if(isMensuel){
      html += renderPeriodSelector('plan');
      html += '<p class="desc" style="margin-top:-6px;">Plan <b>Mensuel</b> : le budget affiché est celui du mois de référence (' + refMonth + ') ; la cotisation suit la période choisie ci-dessus.</p>';
    } else if(isBudget){
      html += renderPeriodSelector('plan');
      html += '<p class="desc" style="margin-top:-6px;">Plan <b>Budget</b> : chaque enveloppe reçoit un montant (Transaction "Entrée" ou "Sortie + case Reçu" liée à cette enveloppe), puis tu enregistres tes dépenses dedans ("Sortie"). Reçu/Dépensé ci-dessous suivent la période choisie ; le <b>Reste</b> est le solde cumulé depuis le début — il se reporte automatiquement d\'un mois à l\'autre, jamais remis à zéro.</p>';
    } else {
      html += '<p class="desc" style="margin-top:-6px;">Plan <b>Projet</b> : les montants s\'accumulent depuis la première cotisation, jusqu\'au budget cible de chaque enveloppe (indépendant de la période).</p>';
    }

    var envs = envelopesFor(plan.id);
    if(envs.length === 0){
      html += '<div class="empty-state">Aucune enveloppe dans ce plan. Ajoutes-en une ci-dessous.</div>';
    } else if(isBudget){
      html += '<div class="table-scroll"><table><thead><tr><th>Code</th><th>Destination</th><th>Description</th><th>Reçu (période)</th><th>Dépensé (période)</th><th>Reste (solde cumulé)</th><th>% Dépensé (cumul)</th><th>Statut</th><th></th></tr></thead><tbody>';
      var tR=0, tD=0, tRecuCumul=0, tDepCumul=0;
      envs.forEach(function(env){
        var recu = getRecuInRange(plan, env, range), depense = getDepenseInRange(plan, env, range);
        var recuCumul = getRecuInRange(plan, env, [null,null]), depenseCumul = getDepenseInRange(plan, env, [null,null]);
        var reste = recuCumul - depenseCumul, p = recuCumul>0 ? depenseCumul/recuCumul : 0, st = statutForBudget(recuCumul, depenseCumul);
        tR += recu; tD += depense; tRecuCumul += recuCumul; tDepCumul += depenseCumul;
        html += '<tr>';
        html += '<td><input type="text" class="cell-input-wide env-field" style="width:64px" data-env="' + env.id + '" data-field="code" value="' + escapeAttr(env.code) + '"></td>';
        html += '<td><input type="text" class="cell-input-wide env-field" data-env="' + env.id + '" data-field="destination" value="' + escapeAttr(env.destination) + '"></td>';
        html += '<td><input type="text" class="cell-input-wide env-field" data-env="' + env.id + '" data-field="description" value="' + escapeAttr(env.description) + '"></td>';
        html += '<td class="num">' + fmt(recu) + '</td><td class="num">' + fmt(depense) + '</td>';
        html += '<td class="num" style="' + (reste<0?'color:var(--rust);font-weight:600;':'') + '">' + fmt(reste) + '</td>';
        html += '<td class="num">' + fmtPct(p) + '</td><td><span class="badge ' + st.cls + '">' + st.label + '</span></td>';
        html += '<td><button class="btn danger" data-del-env="' + env.id + '">Suppr.</button></td></tr>';
      });
      html += '</tbody><tfoot><tr style="font-weight:600;border-top:2px solid var(--line);">' +
        '<td colspan="3">TOTAL — ' + periodeLabelText(f) + '</td><td class="num">' + fmt(tR) + '</td><td class="num">' + fmt(tD) + '</td>' +
        '<td class="num">' + fmt(tRecuCumul-tDepCumul) + '</td><td class="num">' + (tRecuCumul>0?fmtPct(tDepCumul/tRecuCumul):"—") + '</td><td></td><td></td></tr></tfoot></table></div>';
    } else {
      html += '<div class="table-scroll"><table><thead><tr><th>Code</th><th>Destination</th><th>Description</th><th>Budget' + (isMensuel?' (' + refMonth + ')':' cible') + '</th><th>Cotisé</th><th>Reste</th><th>%</th><th>Statut</th><th></th></tr></thead><tbody>';
      var totalBudget=0, totalCotise=0;
      var effRange = plan.type === "projet" ? [null,null] : range;
      envs.forEach(function(env){
        var b = getBudget(plan, env, refMonth), c = getCotiseInRange(plan, env, effRange);
        var reste = b - c, p = b>0 ? c/b : 0, st = statutFor(p);
        totalBudget += b; totalCotise += c;
        html += '<tr>';
        html += '<td><input type="text" class="cell-input-wide env-field" style="width:64px" data-env="' + env.id + '" data-field="code" value="' + escapeAttr(env.code) + '"></td>';
        html += '<td><input type="text" class="cell-input-wide env-field" data-env="' + env.id + '" data-field="destination" value="' + escapeAttr(env.destination) + '"></td>';
        html += '<td><input type="text" class="cell-input-wide env-field" data-env="' + env.id + '" data-field="description" value="' + escapeAttr(env.description) + '"></td>';
        html += '<td class="num"><input type="number" class="cell-input budget-input" data-env="' + env.id + '" value="' + b + '" min="0" step="500"></td>';
        html += '<td class="num">' + fmt(c) + '</td><td class="num">' + fmt(reste) + '</td><td class="num">' + fmtPct(p) + '</td>';
        html += '<td><span class="badge ' + st.cls + '">' + st.label + '</span></td>';
        html += '<td><button class="btn danger" data-del-env="' + env.id + '">Suppr.</button></td></tr>';
      });
      html += '</tbody><tfoot><tr style="font-weight:600;border-top:2px solid var(--line);">' +
        '<td colspan="3">TOTAL' + (isMensuel ? ' — ' + refMonth : ' (cumulé)') + '</td><td class="num">' + fmt(totalBudget) + '</td>' +
        '<td class="num">' + fmt(totalCotise) + '</td><td class="num">' + fmt(totalBudget-totalCotise) + '</td>' +
        '<td class="num">' + (totalBudget>0? fmtPct(totalCotise/totalBudget):"—") + '</td><td></td><td></td></tr></tfoot></table></div>';
    }

    html += '<div style="margin-top:16px;"><button class="btn secondary" id="add-env-btn" data-plan-id="' + plan.id + '">+ Ajouter une enveloppe à ce plan</button></div>';
    if(isMensuel) html += '<div class="footnote">Modifier le budget ici change la valeur du mois de référence (' + refMonth + ') uniquement — les autres mois gardent leur propre valeur.</div>';
    else if(isBudget) html += '<div class="footnote">Reçu et Dépensé (période) viennent de l\'onglet Transactions. Le Reste est le solde cumulé depuis le début — l\'argent qui reste dans l\'enveloppe se reporte automatiquement au mois suivant, sans créer de nouvelle transaction.</div>';
    else html += '<div class="footnote">Modifier le budget ici change le montant cible pour l\'ensemble du projet.</div>';
    return html;
  }

  function renderPeriodSelector(prefix){
    var f = prefix === 'plan' ? state.planPeriod : (prefix === 'notes' ? state.notesPeriod : (prefix === 'foi' ? state.foiPeriod : state.dashboardPeriod));
    var html = '<div class="tx-filters-box" style="margin-bottom:16px;">';
    html += '<div class="field"><label>Période</label><select id="' + prefix + '-periode-type">' +
      PERIOD_PRESETS.map(function(p){ return '<option value="' + p.value + '"' + (f.periodeType===p.value?' selected':'') + '>' + p.label + '</option>'; }).join('') +
      '</select></div>';
