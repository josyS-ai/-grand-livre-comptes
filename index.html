  function drawDonut(canvas, segments, opts){
    if(!canvas) return;
    opts = opts || {};
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    var cx = w/2, cy = h/2;
    var radius = Math.min(w,h)/2 - 32;
    var holeRatio = opts.holeRatio || 0.55;
    var total = segments.reduce(function(s,seg){ return s + (Number(seg.value)||0); }, 0);
    if(total <= 0){
      ctx.fillStyle = '#94A3B8'; ctx.font = "13px 'Inter', sans-serif";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Aucune donnée', cx, cy);
      return;
    }
    var start = -Math.PI/2;
    var minLabelPct = opts.minLabelPct !== undefined ? opts.minLabelPct : 5;
    var labels = [];
    segments.forEach(function(seg){
      var val = Number(seg.value)||0;
      if(val<=0) return;
      var slice = (val/total) * Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,radius,start,start+slice);
      ctx.closePath();
      ctx.fillStyle = seg.color;
      ctx.fill();

      var pct = (val/total) * 100;
      if(pct >= minLabelPct){
        labels.push({ midAngle: start + slice/2, pct: pct, color: seg.color });
      }
      start += slice;
    });
    ctx.beginPath();
    ctx.arc(cx,cy,radius*holeRatio,0,Math.PI*2);
    ctx.fillStyle = opts.holeColor || '#FFFFFF';
    ctx.fill();

    // Lignes de repère + pourcentages, à l'extérieur de l'anneau, colorés comme leur part
    labels.forEach(function(l){
      var ax = cx + Math.cos(l.midAngle) * radius;
      var ay = cy + Math.sin(l.midAngle) * radius;
      var lx = cx + Math.cos(l.midAngle) * (radius + 12);
      var ly = cy + Math.sin(l.midAngle) * (radius + 12);
      var tx = cx + Math.cos(l.midAngle) * (radius + 16);
      var ty = cy + Math.sin(l.midAngle) * (radius + 16);

      ctx.strokeStyle = l.color; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(lx,ly); ctx.stroke();
      ctx.beginPath(); ctx.arc(ax,ay,2.4,0,Math.PI*2); ctx.fillStyle = l.color; ctx.fill();

      var label = (Math.round(l.pct*10)/10) + '%';
      ctx.font = "700 11px 'Inter', sans-serif";
      ctx.textBaseline = 'middle';
      ctx.textAlign = Math.cos(l.midAngle) >= 0.05 ? 'left' : (Math.cos(l.midAngle) <= -0.05 ? 'right' : 'center');
      ctx.fillStyle = l.color;
      ctx.fillText(label, tx, ty);
    });

    if(opts.centerLabel){
      ctx.fillStyle = opts.centerColor || '#0F172A';
      ctx.font = "600 14px 'IBM Plex Mono', monospace";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(opts.centerLabel, cx, cy);
    }
  }

  function drawDashboardChart(){
    var canvas = document.getElementById('chart-dash-out');
    var legend = document.getElementById('dash-chart-legend');
    if(!canvas) return;
    var refMonth = monthLabelFromDate(todayIsoLocal());
    var fullList = categoryTotals('sortie', refMonth);
    var sum = fullList.reduce(function(s,c){ return s+c.total; }, 0);
    var MAX_ROWS = 5;
    var list = fullList.slice(0, MAX_ROWS);
    if(fullList.length > MAX_ROWS){
      var autresTotal = fullList.slice(MAX_ROWS).reduce(function(s,c){ return s+c.total; }, 0);
      list = list.concat([{category:'Autres (' + (fullList.length-MAX_ROWS) + ')', total:autresTotal}]);
    }
    list.forEach(function(c,i){ c.color = CHART_PALETTE[i % CHART_PALETTE.length]; });
    drawDonut(canvas, list.map(function(c){ return {value:c.total, color:c.color}; }), {centerLabel: list.length ? Math.round(sum).toLocaleString('fr-FR') : ''});
    if(legend){
      if(list.length === 0){
        legend.innerHTML = '<div class="empty-state" style="padding:10px;">Aucune dépense ce mois-ci.</div>';
      } else {
        legend.innerHTML = list.map(function(c){
          return '<div class="legend-row"><span class="legend-dot" style="background:' + c.color + ';"></span><span class="legend-name">' + escapeHtml(c.category) + '</span><span class="legend-pct">' + (sum>0?fmtPct(c.total/sum):'') + '</span><span class="legend-val">' + fmt(c.total) + '</span></div>';
        }).join('');
      }
    }
  }

  function globalSearch(query){
    query = (query||'').toLowerCase().trim();
    var results = {transactions:[], notes:[], plans:[], accounts:[], categories:[]};
    if(!query) return results;
    state.transactions.forEach(function(t){
      var hay = [t.category,t.subcategory,t.party,t.note,t.date,String(t.amount)].join(' ').toLowerCase();
      if(hay.indexOf(query)!==-1) results.transactions.push(t);
    });
    state.notes.forEach(function(n){ if((n.text||'').toLowerCase().indexOf(query)!==-1) results.notes.push(n); });
    state.plans.forEach(function(p){
      var matchPlan = (p.name+' '+(p.description||'')).toLowerCase().indexOf(query)!==-1;
      var matchedEnv = envelopesFor(p.id).find(function(e){ return (e.destination+' '+(e.description||'')+' '+e.code).toLowerCase().indexOf(query)!==-1; });
      if(matchPlan || matchedEnv) results.plans.push({plan:p, envelope: matchedEnv});
    });
    state.accounts.forEach(function(a){ if(a.name.toLowerCase().indexOf(query)!==-1) results.accounts.push(a); });
    state.categories.forEach(function(c){
      var subMatch = (c.subcategories||[]).some(function(s){ return s.toLowerCase().indexOf(query)!==-1; });
      if(c.name.toLowerCase().indexOf(query)!==-1 || subMatch) results.categories.push(c);
    });
    ['transactions','notes','plans','accounts','categories'].forEach(function(k){ results[k] = results[k].slice(0,8); });
    return results;
  }

  /* ---------- Calendrier ---------- */
  function pad2(n){ return String(n).padStart(2,'0'); }
  function currentYearMonthStr(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1); }

  function renderCalendrier(){
    if(!state.calendarMonthCursor) state.calendarMonthCursor = currentYearMonthStr();
    var parts = state.calendarMonthCursor.split('-');
    var year = parseInt(parts[0],10), monthIdx = parseInt(parts[1],10) - 1;
    var monthLabel = MOIS_NOMS[monthIdx] + ' ' + year;
    var accFilter = state.calendarAccountFilter;

    var html = '';
    html += '<h2 class="title">Calendrier</h2>';
    html += '<p class="desc">D\'un coup d\'œil, ce que tu as reçu et dépensé chaque jour. Clique un jour pour voir le détail dans Rapports.</p>';

    if(state.accounts.length){
      html += '<div class="tx-filters-box" style="margin-bottom:14px;"><div class="field"><label>Compte</label><select id="cal-account-filter"><option value="Tous"' + (accFilter==="Tous"?" selected":"") + '>Tous les comptes</option>' +
        state.accounts.map(function(a){ return '<option value="' + a.id + '"' + (accFilter===a.id?' selected':'') + '>' + a.icon + ' ' + escapeHtml(a.name) + '</option>'; }).join('') + '</select></div></div>';
    }

    html += '<div class="calendar-nav"><button data-cal-prev="1">‹</button><span>' + monthLabel + '</span><button data-cal-next="1">›</button></div>';

    var dayTotals = {};
    state.transactions.forEach(function(t){
      if(!t.date || t.date.slice(0,7) !== state.calendarMonthCursor) return;
      if(accFilter === "Tous"){
        if(t.type === 'transfert') return;
        if(!dayTotals[t.date]) dayTotals[t.date] = {entree:0, sortie:0};
        dayTotals[t.date][t.type] += Number(t.amount)||0;
      } else {
        if(t.type === 'transfert'){
          if(t.accountId !== accFilter && t.accountToId !== accFilter) return;
          if(!dayTotals[t.date]) dayTotals[t.date] = {entree:0, sortie:0};
          if(t.accountId === accFilter) dayTotals[t.date].sortie += Number(t.amount)||0;
          if(t.accountToId === accFilter) dayTotals[t.date].entree += Number(t.amount)||0;
        } else {
          if(t.accountId !== accFilter) return;
          if(!dayTotals[t.date]) dayTotals[t.date] = {entree:0, sortie:0};
          dayTotals[t.date][t.type] += Number(t.amount)||0;
        }
      }
    });
    var monthIn = 0, monthOut = 0;
    Object.keys(dayTotals).forEach(function(d){ monthIn += dayTotals[d].entree; monthOut += dayTotals[d].sortie; });

    var firstDay = new Date(year, monthIdx, 1);
    var startOffset = (firstDay.getDay()+6) % 7;
    var daysInMonth = new Date(year, monthIdx+1, 0).getDate();
    var cells = [];
    for(var i=0;i<startOffset;i++) cells.push(null);
    for(var d=1; d<=daysInMonth; d++) cells.push(d);
    while(cells.length % 7 !== 0) cells.push(null);

    html += '<div class="calendar-grid">';
    ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].forEach(function(dow){ html += '<div class="calendar-dow">' + dow + '</div>'; });
    var today = todayIsoLocal();
    cells.forEach(function(cell){
      if(cell === null){ html += '<div class="calendar-cell empty"></div>'; return; }
      var dateStr = year + '-' + pad2(monthIdx+1) + '-' + pad2(cell);
      var dt = dayTotals[dateStr];
      var hasData = !!dt;
      html += '<div class="calendar-cell' + (hasData?' has-data':'') + (dateStr===today?' today':'') + '"' + (hasData?' data-cal-day="' + dateStr + '"':'') + '>';
      html += '<div class="calendar-daynum">' + cell + '</div>';
      if(dt){
        if(dt.entree>0) html += '<div class="calendar-in">' + Math.round(dt.entree).toLocaleString('fr-FR') + '</div>';
        if(dt.sortie>0) html += '<div class="calendar-out">' + Math.round(dt.sortie).toLocaleString('fr-FR') + '</div>';
      }
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="calendar-footer">';
    html += '<div class="stat in"><div class="lbl">Total Revenu</div><div class="num">' + fmt(monthIn) + '</div></div>';
    html += '<div class="stat out"><div class="lbl">Total Dépense</div><div class="num">' + fmt(monthOut) + '</div></div>';
    html += '<div class="stat"><div class="lbl">Solde</div><div class="num">' + fmt(monthIn-monthOut) + '</div></div>';
    html += '</div>';
    return html;
  }

    html += '<div class="stat"><div class="lbl">Total</div><div class="num">' + filtered.length + '</div></div>';

    return html;

      html += '<div class="empty-state">Aucune Semence ou Retrait enregistré pour l\'instant. Va dans l\'onglet <b>Catégories</b> et marque au moins une catégorie de dépense comme 🌱 Semence (ex. "Don / Offrande"), puis enregistre une transaction dans cette catégorie.</div>';
      return html;
    }

    var range = getPeriodRange(state.foiPeriod);
    var periodLabel = periodeLabelText(state.foiPeriod);
    var accountFilter = state.foiAccountFilter;
    var accountLabel = foiAccountFilterLabel(accountFilter);
    var scopedLedger = foiFilterLedgerByAccount(fullLedger, accountFilter);

    var cardSolde, cardSeme, cardCredit, cardRetrait, cardNet;
    if(accountFilter === "Tous"){
      cardSolde = foiSoldeAsOf(fullLedger, range[1]);
      var periodTotals = foiTotalsForRange(fullLedger, range);
      cardSeme = periodTotals.seme; cardCredit = periodTotals.credit; cardRetrait = periodTotals.retrait; cardNet = periodTotals.net;
    } else {
      var byAccountAll = foiTotalsByAccount(fullLedger, range);
      var row = byAccountAll.find(function(a){ return accountFilter === "_none" ? a.accountId === null : a.accountId === accountFilter; });
      if(!row) row = { seme:0, credit:0, retrait:0, net:0, solde:0 };
      cardSolde = row.solde; cardSeme = row.seme; cardCredit = row.credit; cardRetrait = row.retrait; cardNet = row.net;
    }

    var titreCartes = accountFilter === "Tous" ? "" : (' — ' + accountLabel);
    html += '<div class="summary-grid kpi-row">';
    html += '<div class="summary-card"><div class="label">Solde du Compte' + titreCartes + '</div><div class="value gold">' + fmt(cardSolde) + '</div><div class="delta">' + escapeHtml(periodLabel) + '</div></div>';
    html += '<div class="summary-card"><div class="label">Semé (' + escapeHtml(periodLabel) + ')</div><div class="value">' + fmt(cardSeme) + '</div><div class="delta">Crédit généré : ' + fmt(cardCredit) + '</div></div>';
    html += '<div class="summary-card"><div class="label">Retiré (' + escapeHtml(periodLabel) + ')</div><div class="value rust">' + fmt(cardRetrait) + '</div><div class="delta">Net période : ' + fmt(cardNet) + '</div></div>';
    html += '</div>';

    var byAccount = accountFilter === "Tous" ? foiTotalsByAccount(fullLedger, range) : foiTotalsByAccount(scopedLedger, range);
    html += '<div class="section-title">Par compte <span class="desc-cell" style="font-weight:400;">(' + escapeHtml(accountLabel) + ' — ' + escapeHtml(periodLabel) + ')</span></div>';
    if(byAccount.length === 0){
      html += '<div class="empty-state">Aucune donnée pour ce compte.</div>';
    } else {
      html += '<div class="table-scroll"><table><thead><tr><th>Compte</th><th>Semé</th><th>Crédit Généré</th><th>Retrait</th><th>Net</th><th>Solde du compte</th></tr></thead><tbody>';
      byAccount.forEach(function(a){
        html += '<tr' + (a.accountId ? ' class="clickable-row" data-open-account="' + a.accountId + '"' : '') + '>';
        html += '<td>' + a.accountIcon + ' ' + escapeHtml(a.accountName) + '</td>';
        html += '<td class="num">' + (a.seme ? fmt(a.seme) : '—') + '</td>';
        html += '<td class="num" style="color:var(--sage);">' + (a.credit ? fmt(a.credit) : '—') + '</td>';
        html += '<td class="num" style="color:var(--rust);">' + (a.retrait ? fmt(a.retrait) : '—') + '</td>';
        html += '<td class="num">' + fmt(a.net) + '</td>';
        html += '<td class="num" style="font-weight:600;">' + fmt(a.solde) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '<div class="footnote" style="margin-top:8px;margin-bottom:20px;">"Sans compte" regroupe les transactions enregistrées sans compte associé (espèces déjà mises de côté). Crée un compte "Ministère" (ou autre) dans l\'onglet <b>Comptes</b> pour qu\'il apparaisse ici automatiquement dès que tu y rattaches des transactions.</div>';

    var filtered = scopedLedger.filter(function(l){ return dateInRangeArr(l.date, range); }).slice().reverse();
    html += '<div class="plan-detail-head" style="margin-bottom:8px;"><h2 class="title" style="font-size:15px;">Détail (' + escapeHtml(accountLabel) + ' — ' + escapeHtml(periodLabel) + ')</h2>' +
      '<div style="display:flex;gap:8px;"><button class="btn secondary small" id="foi-export-csv">CSV</button><button class="btn secondary small" id="foi-export-pdf">PDF</button></div></div>';

    if(filtered.length === 0){
      html += '<div class="empty-state">Aucune Semence ou Retrait sur cette période / ce compte.</div>';
    } else {
      html += '<div class="table-scroll"><table><thead><tr><th>Date</th><th>Libellé / Catégorie</th><th>Semé</th><th>x' + (Number(state.foiMultiplier)||100) + '</th><th>Crédit Généré</th><th>Retrait</th><th>Solde du Compte</th></tr></thead><tbody>';
      filtered.forEach(function(l){
        html += '<tr class="clickable-row" data-view-tx="' + l.id + '">';
        html += '<td class="num">' + fmtDateShort(l.date) + '</td>';
        html += '<td>' + escapeHtml(l.label) + '</td>';
        html += '<td class="num">' + (l.seme ? fmt(l.seme) : '—') + '</td>';
        html += '<td class="num">' + (l.seme ? ('x'+(Number(state.foiMultiplier)||100)) : '—') + '</td>';
        html += '<td class="num" style="color:var(--sage);">' + (l.credit ? fmt(l.credit) : '—') + '</td>';
        html += '<td class="num" style="color:var(--rust);">' + (l.retrait ? fmt(l.retrait) : '—') + '</td>';
        html += '<td class="num" style="font-weight:600;">' + fmt(l.solde) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }

    html += '<div class="footnote">Astuce : filtre par compte et par période ci-dessus (Aujourd\'hui, Cette semaine, Ce mois-ci, Le mois dernier, Cette année, Personnalisée) — les cartes, le tableau "Par compte" et le détail se mettent à jour ensemble, et l\'export CSV/PDF reprend exactement ce filtre. Le multiplicateur (x' + (Number(state.foiMultiplier)||100) + ') se règle dans l\'onglet <b>Paramètres</b>.</div>';
    return html;
  }

  /* ======================================================================
     UTILITAIRES
     ====================================================================== */
  function todayIso(){ var d = new Date(); return d.toISOString().slice(0,10); }
  function fmtDateShort(dateStr){
    if(!dateStr) return '';
    var parts = String(dateStr).split('-');
    if(parts.length !== 3) return dateStr;
    return parts[2] + '-' + parts[1] + '-' + parts[0];
  }
  function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function escapeAttr(s){ return escapeHtml(s); }

     ====================================================================== */
  var currentTxType = "entree";

  var subcatPanelOutsideClickHandler = null;

  function fillTxCategoryOptions(){
    var sel = document.getElementById('tx-category');
    if(!sel) return;
    var cats = categoriesFor(currentTxType);
    sel.innerHTML = cats.map(function(c){ return '<option value="' + escapeAttr(c.name) + '">' + escapeHtml(c.name) + '</option>'; }).join('') + '<option value="__new__">+ Nouvelle catégorie…</option>';
    fillTxSubcategoryOptions();
  }
  function fillTxSubcategoryOptions(){
    var catSel = document.getElementById('tx-category');
    var subSel = document.getElementById('tx-subcategory');
    if(!catSel || !subSel) return;
    var catName = catSel.value;
    var cat = state.categories.find(function(c){ return c.type===currentTxType && c.name===catName; });
    var subs = cat ? (cat.subcategories||[]) : [];
    subSel.innerHTML = '<option value="">Aucune</option>' + subs.map(function(s){ return '<option value="' + escapeAttr(s) + '">' + escapeHtml(s) + '</option>'; }).join('') + '<option value="__new__">+ Nouvelle sous-catégorie…</option>';
  }
  function fillTxEnvelopeOptions(planId){
    var sel = document.getElementById('tx-envelope');
    if(!sel) return;
    var envs = planId ? envelopesFor(planId) : [];
    sel.innerHTML = envs.map(function(e){ return '<option value="' + escapeAttr(e.code) + '">' + e.code + ' — ' + escapeHtml(e.destination) + '</option>'; }).join('');
  }
  function updateEnvelopeRecuVisibility(){
    var recuField = document.getElementById('tx-envelope-recu-field');
    var recuCheckbox = document.getElementById('tx-envelope-recu');
    if(!recuField) return;
    var planSel = document.getElementById('tx-plan');
    var planId = planSel ? planSel.value : '';
    var plan = planId ? getPlan(planId) : null;
    var show = (currentTxType === 'sortie') && plan && plan.type === 'budget';
    recuField.style.display = show ? '' : 'none';
    if(!show && recuCheckbox) recuCheckbox.checked = false;
  }
  function setTxType(type){
    currentTxType = type;
    ['entree','sortie','transfert'].forEach(function(tp){
      var btn = document.getElementById('tx-type-' + tp);
      if(btn) btn.classList.toggle('active', tp===type);
    });
    var accToField = document.getElementById('tx-account-to-field');
    var catField = document.getElementById('tx-category-field');
    var subField = document.getElementById('tx-subcategory-field');
    var planField = document.getElementById('tx-plan-field');
    var envField = document.getElementById('tx-envelope-field');
    var accLabel = document.getElementById('tx-account-label');
    var isTransfert = type === 'transfert';
    if(accToField) accToField.style.display = isTransfert ? '' : 'none';
    if(catField) catField.style.display = isTransfert ? 'none' : '';
    if(subField) subField.style.display = isTransfert ? 'none' : '';
    if(planField) planField.style.display = isTransfert ? 'none' : '';
    if(envField && isTransfert) envField.style.display = 'none';
    if(accLabel) accLabel.textContent = isTransfert ? 'Compte source' : 'Compte';
    if(!isTransfert) fillTxCategoryOptions();
    updateEnvelopeRecuVisibility();
  }

    if(appImportBtn && appImportInput){
      appImportBtn.addEventListener('click', function(){ appImportInput.click(); });
      appImportInput.addEventListener('change', function(){
        if(appImportInput.files && appImportInput.files[0]) importAllDataFromFile(appImportInput.files[0]);
      });
    }
    var appResetBtn = document.getElementById('app-reset-btn');
    if(appResetBtn) appResetBtn.addEventListener('click', function(){
      if(!confirm('Réinitialiser TOUTES les données de cet appareil ? Cette action est irréversible.')) return;
      var typed = prompt('Pour confirmer, tape SUPPRIMER en majuscules :');
      if(typed !== 'SUPPRIMER'){ alert('Réinitialisation annulée.'); return; }
      seedDefaults();
      state.notes = [];
      state.recurringTemplates = [];
      state.monthlyBudgets = {};
      state.pin = null;
      state.locked = false;
      state.selectedMonth = "Août 2026";
      state.selectedPlanId = state.plans.length ? state.plans[0].id : null;
      state.showTxForm = false; state.editingTxId = null; state.modal = null;
      state.txFilters = { compte:"Tous", sens:"Tous", categories:[], subcategories:[], periodeType:"Tous", periodeStart:"", periodeEnd:"" };
      state.activeTab = "dashboard";
      scheduleSave(); render();
      alert('Toutes les données ont été réinitialisées.');
    });

    /* --- Catégories --- */
    document.querySelectorAll('[data-add-cat]').forEach(function(el){
      el.addEventListener('click', function(){
        var type = el.getAttribute('data-add-cat');
        var name = prompt('Nom de la nouvelle catégorie :');
        if(name && name.trim()){ state.categories.push({id:uid(), type:type, name:name.trim(), subcategories:[]}); scheduleSave(); render(); }
      });
    });
    document.querySelectorAll('[data-open-category]').forEach(function(el){
      el.addEventListener('click', function(){ state.modal = {type:'category-edit', id: el.getAttribute('data-open-category')}; render(); });
    });
    var modalCategorySave = document.getElementById('modal-category-save');
    if(modalCategorySave) modalCategorySave.addEventListener('click', function(){
      var cat = state.categories.find(function(c){ return c.id === state.modal.id; }); if(!cat) return;
      var newName = document.getElementById('mc-name').value.trim();
      if(!newName){ alert('Le nom ne peut pas être vide.'); return; }
      if(newName !== cat.name){
        var oldName = cat.name;
        cat.name = newName;
        state.transactions.forEach(function(t){ if(t.type===cat.type && t.category===oldName) t.category = newName; });
        (state.recurringTemplates||[]).forEach(function(rt){ if(rt.type===cat.type && rt.category===oldName) rt.category = newName; });
      }
      if(cat.type === 'sortie'){
        var mcSemence = document.getElementById('mc-is-semence');
        if(mcSemence) cat.isSemence = mcSemence.checked;
      } else {
        var mcRetraitFoi = document.getElementById('mc-is-retrait-foi');
        if(mcRetraitFoi) cat.isRetraitFoi = mcRetraitFoi.checked;
      }
      state.modal = null;
      scheduleSave(); render();
    });
    var modalCategoryDelete = document.getElementById('modal-category-delete');
    if(modalCategoryDelete) modalCategoryDelete.addEventListener('click', function(){
      if(!confirm('Supprimer cette catégorie ? Les transactions déjà enregistrées garderont son nom.')) return;
      state.categories = state.categories.filter(function(c){ return c.id !== state.modal.id; });
      state.modal = null;
      scheduleSave(); render();
    });
    document.querySelectorAll('[data-add-subcat]').forEach(function(el){
      el.addEventListener('click', function(){
        var catId = el.getAttribute('data-add-subcat');
        var name = prompt('Nom de la nouvelle sous-catégorie :');
        var cat = state.categories.find(function(c){ return c.id===catId; });
        if(name && name.trim() && cat){ cat.subcategories = cat.subcategories||[]; cat.subcategories.push(name.trim()); scheduleSave(); render(); }
      });
    });
    document.querySelectorAll('[data-del-subcat]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        var parts = el.getAttribute('data-del-subcat').split('|');
        var cat = state.categories.find(function(c){ return c.id===parts[0]; });
        if(!cat) return;
        if(!confirm('Supprimer cette sous-catégorie ? Les transactions déjà enregistrées garderont son nom.')) return;
        cat.subcategories = (cat.subcategories||[]).filter(function(s){ return s !== parts[1]; });
        scheduleSave(); render();
      });
    });
    document.querySelectorAll('[data-rename-subcat]').forEach(function(el){
      el.addEventListener('click', function(e){
        if(e.target.tagName === 'BUTTON') return;
        var parts = el.getAttribute('data-rename-subcat').split('|');
        var cat = state.categories.find(function(c){ return c.id===parts[0]; });
        if(!cat) return;
        var oldSub = parts[1];
        var newSub = prompt('Nouveau nom pour la sous-catégorie "' + oldSub + '" :', oldSub);
        if(!newSub || !newSub.trim() || newSub.trim()===oldSub) return;
        newSub = newSub.trim();
        cat.subcategories = (cat.subcategories||[]).map(function(s){ return s===oldSub ? newSub : s; });
        state.transactions.forEach(function(t){ if(t.type===cat.type && t.category===cat.name && t.subcategory===oldSub) t.subcategory = newSub; });
        (state.recurringTemplates||[]).forEach(function(rt){ if(rt.type===cat.type && rt.category===cat.name && rt.subcategory===oldSub) rt.subcategory = newSub; });
        scheduleSave(); render();
      });
    });
  }

  function txExportRows(){
    return getFilteredTransactions().slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); }).map(function(t){
      var acc = getAccount(t.accountId), accTo = getAccount(t.accountToId);
      var plan = t.planId ? getPlan(t.planId) : null;
      var env = plan ? state.envelopes.find(function(e){ return e.planId===plan.id && e.code===t.envelopeCode; }) : null;
      return { t:t, acc:acc, accTo:accTo, plan:plan, env:env };
    });
  }

  function exportAllData(){
    var payload = {
      _app: "Grand Livre des Comptes", _version: 4,
      accounts: state.accounts, categories: state.categories,
      plans: state.plans, envelopes: state.envelopes, monthlyBudgets: state.monthlyBudgets,
      transactions: state.transactions, recurringTemplates: state.recurringTemplates,
      notes: state.notes, pin: state.pin, selectedMonth: state.selectedMonth,
      foiMultiplier: state.foiMultiplier
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    a.href = url;
    a.download = 'grand-livre-sauvegarde-' + d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importAllDataFromFile(file){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = JSON.parse(e.target.result);
        data = migrateToV3(data);
        data = migrateToV4(data);
        if(!data || !Array.isArray(data.accounts) || !Array.isArray(data.transactions)){
          alert('Ce fichier ne semble pas être une sauvegarde valide.');
          return;
        }
        if(!confirm('Importer ce fichier remplacera TOUTES les données actuelles de cet appareil. Continuer ?')) return;
        state.accounts = data.accounts || [];
        state.categories = data.categories || [];
        state.plans = data.plans || [];
        state.envelopes = data.envelopes || [];
        state.monthlyBudgets = data.monthlyBudgets || {};
        state.transactions = data.transactions || [];
        state.recurringTemplates = data.recurringTemplates || [];
        state.notes = data.notes || [];
        state.pin = data.pin || null;
        state.locked = false;
        state.selectedMonth = data.selectedMonth || "Août 2026";
        state.foiMultiplier = data.foiMultiplier || 100;
        state.selectedPlanId = state.plans.length ? state.plans[0].id : null;
        state.modal = null;
        scheduleSave();
        render();
        alert('Import réussi !');
      }catch(err){
        alert('Erreur de lecture du fichier : ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  function exportTransactionsCsv(){
    var summary = filterSummaryLines();
    var metaRows = [
      ['Grand Livre des Comptes — Export Transactions'],
      ['Généré le', formatDateFr(new Date())],
      ['Compte', summary.compte],
      ['Sens', summary.sens],
      ['Catégories', summary.categorie],
      ['Sous-catégories', summary.sousCategorie],
      ['Période', summary.periode],
      ['Recherche', state.txSearchQuery || '(aucune)'],
      []
    ];
    var headers = ['Date','Type','Compte','Compte destination','Catégorie','Sous-catégorie','Tiers','Paiement','Plan','Enveloppe','Statut Enveloppe','Montant (FCFA)','Note'];
    var rows = txExportRows().map(function(r){
      var t=r.t;
      var statutEnv = t.envelopeRecu ? 'Alimente (Reçu)' : (isEnvelopeSpendAlreadyCounted(t) ? 'Déjà comptée au retrait (exclue des totaux)' : '');
      return [ fmtDateShort(t.date), t.type==='entree'?'Entrée':(t.type==='sortie'?'Sortie':'Transfert'), r.acc?r.acc.name:'', r.accTo?r.accTo.name:'', t.category||'', t.subcategory||'', t.party||'', t.payment||'', r.plan?r.plan.name:'', r.env?r.env.destination:'', statutEnv, t.amount, t.note||'' ];
    });
    var allRows = metaRows.concat([headers]).concat(rows);
    var csv = allRows.map(function(r){ return r.map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(';'); }).join('\r\n');
    var blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'transactions.csv'; a.click();
    URL.revokeObjectURL(url);
  }

        if(d.outList.length){
          doc.setFontSize(9.5); doc.setTextColor(30);
          doc.text('Détail — Dépenses par catégorie', 14, startY);
          doc.autoTable({
            startY: startY + 3,
            head: [['Catégorie','%','Montant']],

            styles: { fontSize: 8 }, headStyles: { fillColor: [239,68,68] },
            margin: { left: 14, right: 14 }
          });
          startY = doc.lastAutoTable.finalY + 10;
        }
        if(d.inList.length){
          doc.setFontSize(9.5); doc.setTextColor(30);
          doc.text('Détail — Revenus par catégorie', 14, startY);

            startY: startY + 3,

  function exportFoiCsv(){
    var fullLedger = buildFoiLedger();
    var range = getPeriodRange(state.foiPeriod);
    var accountFilter = state.foiAccountFilter;
    var accountLabel = foiAccountFilterLabel(accountFilter);
    var scopedLedger = foiFilterLedgerByAccount(fullLedger, accountFilter);
    var filtered = scopedLedger.filter(function(l){ return dateInRangeArr(l.date, range); });
    var multiplier = Number(state.foiMultiplier)||100;

    var cardSolde, cardSeme, cardCredit, cardRetrait;
    if(accountFilter === "Tous"){
      cardSolde = foiSoldeAsOf(fullLedger, range[1]);
      var periodTotals = foiTotalsForRange(fullLedger, range);
      cardSeme = periodTotals.seme; cardCredit = periodTotals.credit; cardRetrait = periodTotals.retrait;
    } else {
      var byAccountAll = foiTotalsByAccount(fullLedger, range);
      var row = byAccountAll.find(function(a){ return accountFilter === "_none" ? a.accountId === null : a.accountId === accountFilter; });
      if(!row) row = { seme:0, credit:0, retrait:0, solde:0 };
      cardSolde = row.solde; cardSeme = row.seme; cardCredit = row.credit; cardRetrait = row.retrait;
    }
    var byAccount = accountFilter === "Tous" ? foiTotalsByAccount(fullLedger, range) : foiTotalsByAccount(scopedLedger, range);

    var metaRows = [
      ['Grand Livre des Comptes — Crédit de Foi'],
      ['Généré le', formatDateFr(new Date())],
      ['Multiplicateur', 'x' + multiplier],
      ['Compte', accountLabel],
      ['Période', periodeLabelText(state.foiPeriod)],
      ['Solde du Compte (' + accountLabel + ')', cardSolde],
      ['Semé sur la période', cardSeme],
      ['Crédit généré sur la période', cardCredit],
      ['Retiré sur la période', cardRetrait],
      [],
      ['Par compte', 'Semé', 'Crédit Généré', 'Retiré', 'Net', 'Solde du compte']
    ];
    byAccount.forEach(function(a){ metaRows.push([a.accountName, a.seme, a.credit, a.retrait, a.net, a.solde]); });
    metaRows.push([]);
    var headers = ['Date','Libellé / Catégorie','Semé (FCFA)','Multiplicateur','Crédit Généré','Retrait','Solde du Compte'];
    var rows = filtered.map(function(l){
      return [ l.date, l.label, l.seme||'', l.seme?('x'+multiplier):'', l.credit||'', l.retrait||'', l.solde ];
    });
    var allRows = metaRows.concat([headers]).concat(rows);
    var csv = allRows.map(function(r){ return r.map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(';'); }).join('\r\n');
    var blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'credit-de-foi.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  /* ======================================================================
     DÉMARRAGE

  var txPanelBackdropEl = document.getElementById('tx-panel-backdrop');
  if(txPanelBackdropEl) txPanelBackdropEl.addEventListener('click', function(){
    state.showTxForm = false;
    state.editingTxId = null;
    render();
  });
  function wakeUpRender(){
    if(!state.loaded) return;
    render();
  }
  function syncOnReconnect(){
    if(!state.loaded) return;
    if(state.showTxForm || state.modal){ render(); return; } // ne pas perturber une saisie en cours
    if(getSyncCode()) mergeSync(); else render();
  }
  window.addEventListener('online', syncOnReconnect);
  window.addEventListener('offline', function(){ if(getSyncCode()) setSyncStatus('offline'); });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') wakeUpRender();
  });
  window.addEventListener('pageshow', function(e){
    wakeUpRender();
  });
  window.addEventListener('focus', function(){
    wakeUpRender();
  });
  render();
  loadData();
})();

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('Échec enregistrement Service Worker:', e); });
  });
